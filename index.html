              <h1 className="text-xl font-semibold text-[#EDEFF1] tracking-tight" style={{ fontFamily: "'Barlow Condensed', sans-serif", fontStretch: 'condensed' }}>PLANT DASHBOARD</h1>
              <div className="text-[10px] text-[#5A6570] mt-0.5">Prepared by Jijo Wilson · Technical Planning Section · Development &amp; Technical Services</div>
            </div>

            {(tab === 'overview' || tab === 'master' || tab === 'ganttPreview' || tab === 'assetMaster' || tab === 'catalog' || tab === 'utility') && (
              <>
                <div className="flex items-center gap-1.5 bg-[#181D23] border border-[#2A313A] rounded-sm px-2.5 py-1.5">
                  <span className="text-[10px] text-[#5A6570] shrink-0">Plant</span>
                  <select value={filterPlant} onChange={(e) => { setFilterPlant(e.target.value); setFilterLocation('All'); setFilterSection('All'); }} className="bg-[#181D23] text-xs text-[#C4CBD2] focus:outline-none">
                    {plants.map(p => <option key={p} value={p}>{p}</option>)}
                  </select>
                </div>
                <div className="flex items-center gap-1.5 bg-[#181D23] border border-[#2A313A] rounded-sm px-2.5 py-1.5">
                  <span className="text-[10px] text-[#5A6570] shrink-0">Location</span>
                  <select value={filterLocation} onChange={(e) => { setFilterLocation(e.target.value); setFilterSection('All'); }} className="bg-[#181D23] text-xs text-[#C4CBD2] focus:outline-none">
                    {locations.map(l => <option key={l} value={l}>{l}</option>)}
                  </select>
                </div>
                <div className="flex items-center gap-1.5 bg-[#181D23] border border-[#2A313A] rounded-sm px-2.5 py-1.5">
                  <span className="text-[10px] text-[#5A6570] shrink-0">Section</span>
                  <select value={filterSection} onChange={(e) => { setFilterSection(e.target.value); setFilterCategory('All'); }} className="bg-[#181D23] text-xs text-[#C4CBD2] focus:outline-none">
                    {sections.map(s => <option key={s} value={s}>{sectionLabel(s)}</option>)}
                  </select>
                </div>
                <div className="flex items-center gap-1.5 bg-[#181D23] border border-[#2A313A] rounded-sm px-2.5 py-1.5">
                  <span className="text-[10px] text-[#5A6570] shrink-0">Category</span>
                  <select value={filterCategory} onChange={(e) => setFilterCategory(e.target.value)} className="bg-[#181D23] text-xs text-[#C4CBD2] focus:outline-none">
                    {categories.map(c => <option key={c} value={c}>{c === 'All' ? 'All' : categoryLabel(c)}</option>)}
                  </select>
                </div>
                {(filterPlant !== 'All' || filterLocation !== 'All' || filterSection !== 'All' || filterCategory !== 'All') && (
                  <button
                    onClick={() => { setFilterPlant('All'); setFilterLocation('All'); setFilterSection('All'); setFilterCategory('All'); }}
                    className="text-xs font-medium px-2.5 py-1.5 rounded-sm bg-[#232A32] hover:bg-[#2A323C] text-[#8B95A1] transition-colors"
                    title="Reset filters back to All (does not delete any data)"
                  >
                    Reset filters
                  </button>
                )}
              </>
            )}
            <div className="flex items-center gap-2 pl-2 ml-1 border-l border-[#2A313A]">
              <span className="text-[11px] text-[#8B95A1]">{userName} <span className="text-[#4FD1C5]">· {role}</span></span>

            return (
              <button
                key={t.id}
                onClick={() => setTab(t.id)}
                className={`flex items-center gap-1.5 px-3 py-2.5 text-xs font-medium border-b-2 whitespace-nowrap transition-colors ${active ? 'border-[#4FD1C5] text-[#EDEFF1]' : 'border-transparent text-[#7A8590] hover:text-[#B8C0C8]'}`}
              >
                <Icon size={14} strokeWidth={1.75} />
                {t.label}

                <button
                  onClick={() => { if (window.confirm('Clear all saved data on this computer and start fresh? Your original uploaded files are not deleted — just re-upload them after this.')) resetAllData(); }}

                >

                </button>
              </div>

              <StatGauge label="Net Book Value" value={assetMaster.length > 0 ? `${Math.round(assetOverviewTotals.totalProjectedNBV).toLocaleString()} SAR` : '—'} sub={assetMaster.length > 0 ? 'projected today' : 'upload Asset Master'} icon={Gauge} accent="bg-amber-400" />
              <StatGauge label="Equipment Down" value={downCount} sub="requires action" icon={Wrench} accent="bg-rose-400" />
              <StatGauge label="Open Alerts" value={alertCount} sub="from PM inspections" icon={AlertTriangle} accent="bg-amber-400" />

// ---------- OneDrive data loading (Microsoft Graph API, via a shared-folder link) ----------
// Reads the real data files from Jijo's OneDrive folder every time someone signs in — this is
// what makes an update by Jijo visible to everyone else automatically. Uses a "People in
// Saudi Ceramics with the link" share (view access), resolved through Microsoft Graph's
// /shares endpoint — this correctly works no matter whose account is signed in (Admin,
// Management, Technician), since each person's own valid login is what unlocks the share,
// rather than the app trying to look inside that specific person's own OneDrive.
const GRAPH_SCOPES = ['User.Read', 'Files.Read'];

// One-time setup value — the "People in Saudi Ceramics with the link" share URL for the
// "Plant Dashboard Data" folder. Kept as the one clearly-separate line most likely to ever
// need updating (e.g. if the link is ever revoked and recreated) — everything else in this
// file should never need to change alongside it.
const SHARED_FOLDER_URL = 'https://saudiceramics-my.sharepoint.com/personal/jijo_wilson_saudiceramics_com/_layouts/15/guestaccess.aspx?share=IgDAdO--Txn0R6XPfFnhRvj8AdgyJWxkdkWp4U_HuKW3FwE&e=2YEZYC';

// Every file this app reads, its parser (defaults to the standard spreadsheet reader used
// everywhere else), and its row-mapper — the exact same functions the manual upload buttons
// already use, so a OneDrive-sourced file is processed identically to an uploaded one.
// Utility Bills' 3 files have no mapRow — their parsers already return a ready-to-use
// structure directly, not a list of rows to map.
const ONEDRIVE_FILES = [
  { key: 'equipment', fileName: 'Equipment_Master.xlsx', parseFn: parseSpreadsheetFile, mapRow: mapEquipmentRow },
  { key: 'assetMaster', fileName: 'Asset_Master.xlsx', parseFn: parseSpreadsheetFile, mapRow: mapAssetRow },
  { key: 'pmSchedule', fileName: 'PM_Schedule.xlsx', parseFn: parseSpreadsheetFile, mapRow: mapPmScheduleRow },
  { key: 'catalogDocs', fileName: 'Catalog_SoftCopy.xlsx', parseFn: parseCatalogFile, mapRow: mapCatalogSoftRow },
  { key: 'hardCopyDocs', fileName: 'Catalog_HardCopy.xlsx', parseFn: parseSpreadsheetFile, mapRow: mapCatalogHardRow },
  { key: 'utilityBillSummary', fileName: 'Utility_BillSummary.xlsx', parseFn: parseBillSummaryFile, mapRow: null },
  { key: 'utilityGasAlloc', fileName: 'Utility_GasWaterAllocation.xlsx', parseFn: parseGasWaterAllocFile, mapRow: null },
  { key: 'utilityElecAlloc', fileName: 'Utility_ElectricityAllocation.xlsx', parseFn: parseElectricityAllocFile, mapRow: null },
];

async function acquireGraphToken(instance, account) {
  const request = { scopes: GRAPH_SCOPES, account };
  try {
    // Silent first — if this permission was already approved before, no popup needed at all.
    const result = await instance.acquireTokenSilent(request);
    return result.accessToken;
  } catch (silentError) {
    // Needs a fresh consent (e.g. first time this specific permission has been requested) —
    // this is the popup where Microsoft may show "admin approval needed" if the tenant
    // requires it for this permission.
    const result = await instance.acquireTokenPopup(request);
    return result.accessToken;
  }
}

// Converts a normal sharing URL into the special encoded "share token" format the Graph API's
// /shares endpoint requires — documented Microsoft algorithm: base64-encode the URL, convert
// to unpadded base64url, prefix with "u!".
function encodeSharingUrl(url) {
  const base64 = btoa(url);
  const base64url = base64.replace(/=+$/, '').replace(/\//g, '_').replace(/\+/g, '-');
  return 'u!' + base64url;
}

async function resolveSharedFolder(accessToken) {
  const shareToken = encodeSharingUrl(SHARED_FOLDER_URL);
  const res = await fetch(`https://graph.microsoft.com/v1.0/shares/${shareToken}/driveItem`, {
    headers: { Authorization: `Bearer ${accessToken}` },
  });
  if (!res.ok) {
    throw new Error(`Could not open the shared OneDrive folder (status ${res.status}). The share link may need to be recreated, or this account may not have access to it.`);
  }
  const item = await res.json();
  return { driveId: item.parentReference.driveId, folderId: item.id };
}

async function listSharedFolderFiles(accessToken, driveId, folderId) {
  const res = await fetch(`https://graph.microsoft.com/v1.0/drives/${driveId}/items/${folderId}/children`, {
    headers: { Authorization: `Bearer ${accessToken}` },
  });
  if (!res.ok) throw new Error(`Could not list files in the shared folder (status ${res.status}).`);
  const json = await res.json();
  return json.value || [];
}

async function fetchSharedFileContent(accessToken, driveId, itemId, fileName) {
  const res = await fetch(`https://graph.microsoft.com/v1.0/drives/${driveId}/items/${itemId}/content`, {
    headers: { Authorization: `Bearer ${accessToken}` },
  });
  if (!res.ok) throw new Error(`Could not read "${fileName}" (status ${res.status}).`);
  const blob = await res.blob();
  // The parsers use .name for status displays and error messages — a Blob doesn't have one
  // by default, so this fills it in to match what a real uploaded File looks like.
  blob.name = fileName;
  return blob;
}

// Fetches and processes all real data files, returning both the loaded data AND a per-file
// status report — one file failing (renamed, not yet created, etc.) shouldn't block the
// others; the dashboard falls back to empty data for whichever ones didn't load, and the
// report lets the person see exactly what succeeded or failed and why.
async function loadAllFromOneDrive(instance, account, onProgress) {
  const accessToken = await acquireGraphToken(instance, account);
  onProgress?.('Opening the shared OneDrive folder…');
  const { driveId, folderId } = await resolveSharedFolder(accessToken);
  const children = await listSharedFolderFiles(accessToken, driveId, folderId);
  const findChild = (fileName) => children.find(c => (c.name || '').toLowerCase() === fileName.toLowerCase());

  const data = {};
  const report = [];

  for (const { key, fileName, parseFn, mapRow } of ONEDRIVE_FILES) {
    onProgress?.(`Reading ${fileName}…`);
    const child = findChild(fileName);
    if (!child) {
      report.push({ fileName, status: 'error', message: 'Not found in the shared folder — check the filename matches exactly.' });
      continue;
    }
    try {
      const blob = await fetchSharedFileContent(accessToken, driveId, child.id, fileName);
      const rawResult = await parseFn(blob);
      if (mapRow) {
        const mapped = rawResult.map(mapRow).filter(Boolean);
        data[key] = mapped;
        report.push({ fileName, status: 'ok', count: mapped.length });
      } else {
        data[key] = rawResult; // Utility Bills parsers already return a ready-to-use structure
        report.push({ fileName, status: 'ok' });
      }
    } catch (err) {
      report.push({ fileName, status: 'error', message: err.message || String(err) });
    }
  }

  return { data, report };
}

// ---------- Sign-in gate ----------
// Shows the Microsoft sign-in screen until someone's authenticated; once signed in, renders
// the real dashboard with that person's role. This is the same MSAL setup already verified
// working end-to-end (Azure app registration + GitHub Pages redirect address).
const msalConfig = {
  auth: {
    clientId: 'f3c55e54-908b-4773-b0ea-a198f0235471',
    authority: 'https://login.microsoftonline.com/organizations',
    redirectUri: window.location.origin + window.location.pathname,
  },
  cache: { cacheLocation: 'sessionStorage' },
};

// Role list — who's allowed in, and what they see. This is Step 1 of the plan discussed:
// an editable list Jijo maintains directly (for now, here in the file; later this could move
// to somewhere he can edit without needing a code change, like a small admin screen).
// IMPORTANT: replace the placeholder email below with real Saudi Ceramics email addresses.
const ROLES = {
  'jijo.wilson@saudiceramics.com': 'Admin',
  // 'manager.email@saudiceramics.com': 'Management',
  // 'technician.email@saudiceramics.com': 'Technician',
};
function roleFor(email) {
  return ROLES[(email || '').toLowerCase()] || null; // null = signed in, but no role assigned yet
}

// The MSAL instance is created once here (not inside SignInScreen) so that both the sign-in
// flow AND the real "Sign out" button inside the dashboard header can share the exact same
// session — this is what makes Sign out actually clear the session instead of just reloading
// into an already-cached login.
let sharedMsalInstance = null;
let sharedMsalReady = null;
function getMsal() {
  if (!sharedMsalInstance && typeof msal !== 'undefined') {
    sharedMsalInstance = new msal.PublicClientApplication(msalConfig);
    sharedMsalReady = sharedMsalInstance.initialize();
  }
  return { instance: sharedMsalInstance, ready: sharedMsalReady };
}

function SignInScreen({ onSignedIn }) {
  const [status, setStatus] = useState({ type: 'idle', message: '' });

  useEffect(() => {
    const { instance, ready } = getMsal();
    if (!instance) {
      setStatus({ type: 'error', message: 'The Microsoft sign-in library failed to load. Check your internet connection and refresh.' });
      return;
    }
    ready.then(() => {
      const existing = instance.getAllAccounts();
      if (existing.length > 0) onSignedIn(existing[0]);
    }).catch(err => {
      setStatus({ type: 'error', message: 'Failed to initialize sign-in: ' + (err?.message || String(err)) });
    });
  }, []);

  const handleSignIn = async () => {
    setStatus({ type: 'loading', message: 'Opening Microsoft sign-in…' });
    try {
      const { instance, ready } = getMsal();
      await ready;
      const result = await instance.loginPopup({ scopes: ['User.Read', 'Files.Read'] });
      onSignedIn(result.account);
    } catch (err) {
      const msg = String(err);
      let friendly = 'Sign-in failed: ' + (err?.message || msg);
      if (msg.includes('AADSTS50011')) friendly = 'This address isn\'t registered in Azure yet as a redirect URI.';
      else if (msg.includes('popup_window_error')) friendly = 'Pop-up blocked — please allow pop-ups for this page and try again.';
      else if (msg.includes('interaction_in_progress')) friendly = 'A previous sign-in attempt is still active — close this tab, reopen fresh, and try again.';
      setStatus({ type: 'error', message: friendly });
    }
  };

  return (
    <div className="min-h-screen bg-[#0E1114] flex items-center justify-center" style={{ fontFamily: "'Inter', system-ui, sans-serif" }}>
      <div className="bg-[#181D23] border border-[#2A313A] rounded-xl p-10 w-[380px] text-center">
        <div className="text-[#4FD1C5] text-xs font-semibold tracking-wide uppercase mb-1">Saudi Ceramics</div>
        <h1 className="text-xl text-[#EDEFF1] mb-6">Plant Dashboard</h1>
        <button
          onClick={handleSignIn}
          disabled={status.type === 'loading'}
          className="w-full py-3 rounded-md border border-[#2A313A] bg-[#232A32] hover:bg-[#2A323C] text-[#EDEFF1] text-sm font-medium flex items-center justify-center gap-2.5 transition-colors disabled:opacity-60"
        >
          <svg width="18" height="18" viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
          Sign in with Microsoft
        </button>
        <div className={`mt-4 text-xs min-h-[16px] ${status.type === 'error' ? 'text-rose-400' : 'text-[#8B95A1]'}`}>
          {status.message}
        </div>
      </div>
    </div>
  );
}

function NoRoleScreen({ account, onSignOut }) {
  return (
    <div className="min-h-screen bg-[#0E1114] flex items-center justify-center" style={{ fontFamily: "'Inter', system-ui, sans-serif" }}>
      <div className="bg-[#181D23] border border-[#2A313A] rounded-xl p-10 w-[420px] text-center">
        <div className="text-[#4FD1C5] text-xs font-semibold tracking-wide uppercase mb-1">Saudi Ceramics</div>
        <h1 className="text-xl text-[#EDEFF1] mb-3">Plant Dashboard</h1>
        <p className="text-sm text-[#8B95A1] mb-1">You're signed in as <span className="text-[#D5D9DD]">{account.name}</span> ({account.username}),</p>
        <p className="text-sm text-[#8B95A1] mb-6">but no role has been assigned to this account yet. Contact the Admin to be added.</p>
        <button onClick={onSignOut} className="text-xs text-[#7A8590] hover:text-[#D5D9DD] transition-colors">Sign out</button>
      </div>
    </div>
  );
}

function LoadingScreen({ message }) {
  return (
    <div className="min-h-screen bg-[#0E1114] flex items-center justify-center" style={{ fontFamily: "'Inter', system-ui, sans-serif" }}>
      <div className="bg-[#181D23] border border-[#2A313A] rounded-xl p-10 w-[420px] text-center">
        <div className="text-[#4FD1C5] text-xs font-semibold tracking-wide uppercase mb-1">Saudi Ceramics</div>
        <h1 className="text-xl text-[#EDEFF1] mb-6">Plant Dashboard</h1>
        <div className="text-sm text-[#8B95A1]">{message}</div>
      </div>
    </div>
  );
}

function LoadErrorScreen({ report, onContinueAnyway, onRetry }) {
  const failed = report.filter(r => r.status === 'error');
  const ok = report.filter(r => r.status === 'ok');
  return (
    <div className="min-h-screen bg-[#0E1114] flex items-center justify-center p-6" style={{ fontFamily: "'Inter', system-ui, sans-serif" }}>
      <div className="bg-[#181D23] border border-[#2A313A] rounded-xl p-8 w-[520px]">
        <div className="text-[#4FD1C5] text-xs font-semibold tracking-wide uppercase mb-1">Saudi Ceramics</div>
        <h1 className="text-lg text-[#EDEFF1] mb-4">Loading from OneDrive</h1>
        {ok.length > 0 && (
          <div className="mb-3 text-xs text-teal-400">
            ✓ Loaded successfully: {ok.map(o => o.fileName).join(', ')}
          </div>
        )}
        {failed.length > 0 && (
          <div className="mb-4">
            <div className="text-xs text-rose-400 mb-2">Could not load {failed.length} file{failed.length > 1 ? 's' : ''}:</div>
            {failed.map(f => (
              <div key={f.fileName} className="text-[11px] text-[#8B95A1] mb-1.5 pl-2 border-l-2 border-rose-400/40">
                <span className="text-[#D5D9DD]">{f.fileName}</span> — {f.message}
              </div>
            ))}
          </div>
        )}
        <div className="flex gap-2 mt-5">
          <button onClick={onRetry} className="text-xs font-medium px-3 py-2 rounded-sm bg-[#232A32] hover:bg-[#2A323C] text-[#D5D9DD] transition-colors">
            Try again
          </button>
          <button onClick={onContinueAnyway} className="text-xs font-medium px-3 py-2 rounded-sm bg-teal-400/10 hover:bg-teal-400/20 text-teal-400 border border-teal-400/30 transition-colors">
            Continue with what loaded
          </button>
        </div>
      </div>
    </div>
  );
}

function AuthGate() {
  const [account, setAccount] = useState(null);
  const [loadState, setLoadState] = useState({ phase: 'idle' }); // idle | loading | error | ready
  const [oneDriveData, setOneDriveData] = useState(null);

  const handleSignOut = () => {
    const { instance } = getMsal();
    if (instance) {
      instance.logoutPopup().catch(() => {}).finally(() => { setAccount(null); setLoadState({ phase: 'idle' }); });
    } else {
      setAccount(null);
    }
  };

  const runLoad = async (acc) => {
    setLoadState({ phase: 'loading', message: 'Connecting to OneDrive…' });
    try {
      const { instance } = getMsal();
      const { data, report } = await loadAllFromOneDrive(instance, acc, (msg) => setLoadState({ phase: 'loading', message: msg }));
      setOneDriveData(data);
      const anyFailed = report.some(r => r.status === 'error');
      if (anyFailed) {
        setLoadState({ phase: 'error', report });
      } else {
        setLoadState({ phase: 'ready' });
      }
    } catch (err) {
      // A failure here (before any individual file was even attempted) usually means the
      // Files.Read permission itself wasn't granted — e.g. an admin-approval wall — rather
      // than a problem with any specific file.
      setLoadState({ phase: 'error', report: [{ fileName: 'OneDrive connection', status: 'error', message: err.message || String(err) }] });
    }
  };

  const handleSignedIn = (acc) => {
    setAccount(acc);
    runLoad(acc);
  };

  if (!account) {
    return <SignInScreen onSignedIn={handleSignedIn} />;
  }
  const role = roleFor(account.username);
  if (!role) {
    return <NoRoleScreen account={account} onSignOut={handleSignOut} />;
  }
  if (loadState.phase === 'loading') {
    return <LoadingScreen message={loadState.message} />;
  }
  if (loadState.phase === 'error') {
    return (
      <LoadErrorScreen
        report={loadState.report}
        onRetry={() => runLoad(account)}
        onContinueAnyway={() => setLoadState({ phase: 'ready' })}
      />
    );
  }
  return <AssetDashboard role={role} userName={account.name} onSignOut={handleSignOut} initialData={oneDriveData || {}} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<AuthGate />);
</script>
