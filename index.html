<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Plant Dashboard — Sign In</title>
<!-- MSAL (Microsoft Authentication Library) — the official Microsoft library that handles
     the actual "Sign in with Microsoft" flow. Loaded from Microsoft's own CDN, same pattern
     as React/Tailwind are already loaded from cdnjs in the main dashboard. -->
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
<style>
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #0E1114;
    color: #EDEFF1;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #181D23;
    border: 1px solid #2A313A;
    border-radius: 12px;
    padding: 40px;
    width: 380px;
    text-align: center;
  }
  .brand { color: #4FD1C5; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 4px; }
  h1 { font-size: 20px; margin: 0 0 24px; }
  button {
    width: 100%;
    padding: 12px;
    border-radius: 6px;
    border: 1px solid #2A313A;
    background: #232A32;
    color: #EDEFF1;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background 0.15s;
  }
  button:hover { background: #2A323C; }
  button:disabled { opacity: 0.6; cursor: default; }
  .status { margin-top: 16px; font-size: 12px; color: #8B95A1; min-height: 16px; }
  .status.error { color: #FB7185; }
  .user-box { display: none; text-align: left; margin-top: 20px; padding: 16px; background: #0E1114; border: 1px solid #2A313A; border-radius: 8px; font-size: 13px; }
  .user-box .row { margin-bottom: 6px; }
  .user-box .label { color: #7A8590; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Saudi Ceramics</div>
    <h1>Plant Dashboard</h1>
    <button id="loginBtn">
      <svg width="18" height="18" viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
      Sign in with Microsoft
    </button>
    <div id="status" class="status"></div>
    <div id="userBox" class="user-box">
      <div class="row"><span class="label">Name: </span><span id="userName"></span></div>
      <div class="row"><span class="label">Email: </span><span id="userEmail"></span></div>
      <div class="row"><span class="label">Role: </span><span id="userRole"></span></div>
    </div>
  </div>

  <script>
    // ---------- Configuration ----------
    // The Client ID identifies THIS app to Microsoft (safe to be public — it's an ID, not a
    // secret). "organizations" restricts sign-in to work/school accounts from any company —
    // the app registration itself (set to "Single tenant") is what actually locks this down
    // to Saudi Ceramics accounts only; Microsoft enforces that server-side regardless of what
    // authority URL is used here.
    const msalConfig = {
      auth: {
        clientId: 'f3c55e54-908b-4773-b0ea-a198f0235471',
        authority: 'https://login.microsoftonline.com/organizations',
        redirectUri: window.location.origin + window.location.pathname,
      },
      cache: {
        cacheLocation: 'sessionStorage',
      },
    };

    const loginBtn = document.getElementById('loginBtn');
    const statusEl = document.getElementById('status');
    const userBox = document.getElementById('userBox');

    // If this library didn't load (e.g. a blocked/failed CDN request), fail visibly on the
    // page itself rather than only in the console, so this is diagnosable without DevTools.
    if (typeof msal === 'undefined') {
      statusEl.className = 'status error';
      statusEl.textContent = 'The Microsoft sign-in library failed to load. Check your internet connection and try refreshing.';
      loginBtn.disabled = true;
    }

    const msalInstance = typeof msal !== 'undefined' ? new msal.PublicClientApplication(msalConfig) : null;

    // ---------- Role list ----------
    // Placeholder for now — Step 1 of the plan discussed: an editable list mapping each
    // person's email to a role. For real use this would live somewhere Jijo can edit directly
    // (a Google Sheet, or an in-app admin screen) rather than being hardcoded here.
    const ROLES = {
      'jijo.wilson@saudiceramics.com': 'Admin',
      // add more people here as: 'their.email@saudiceramics.com': 'Management' or 'Technician'
    };
    function roleFor(email) {
      return ROLES[(email || '').toLowerCase()] || 'No role assigned — contact Admin';
    }

    function showSignedIn(account) {
      loginBtn.style.display = 'none';
      statusEl.textContent = '';
      userBox.style.display = 'block';
      document.getElementById('userName').textContent = account.name || '-';
      document.getElementById('userEmail').textContent = account.username || '-';
      document.getElementById('userRole').textContent = roleFor(account.username);
    }

    // MSAL Browser v3 requires initialize() to be called (and awaited) before ANY other MSAL
    // method — including getAllAccounts() and loginPopup(). This promise is awaited once here
    // on page load, and awaited again (instantly, since it's already resolved by then) at the
    // start of the click handler below, so login can never be attempted before it's ready.
    let msalReady = Promise.resolve();
    if (msalInstance) {
      msalReady = msalInstance.initialize().then(() => {
        const existingAccounts = msalInstance.getAllAccounts();
        if (existingAccounts.length > 0) showSignedIn(existingAccounts[0]);
      }).catch(err => {
        statusEl.className = 'status error';
        statusEl.textContent = 'Failed to initialize sign-in: ' + (err && err.message ? err.message : String(err));
        loginBtn.disabled = true;
      });
    }

    loginBtn.addEventListener('click', async () => {
      loginBtn.disabled = true;
      statusEl.className = 'status';
      statusEl.textContent = 'Opening Microsoft sign-in…';
      try {
        await msalReady; // ensures initialize() has completed before any MSAL call below
        const result = await msalInstance.loginPopup({
          scopes: ['User.Read'], // the minimum permission needed just to confirm who's signed in
        });
        showSignedIn(result.account);
      } catch (err) {
        statusEl.className = 'status error';
        // Common early errors and what they actually mean, in plain terms:
        if (String(err).includes('AADSTS50011')) {
          statusEl.textContent = 'Redirect address not yet registered in Azure — this is expected before deployment.';
        } else if (String(err).includes('popup_window_error')) {
          statusEl.textContent = 'Pop-up blocked — please allow pop-ups for this page and try again.';
        } else {
          statusEl.textContent = 'Sign-in failed: ' + (err && err.message ? err.message : String(err));
        }
        console.error(err);
      } finally {
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
