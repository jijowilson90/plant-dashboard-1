// ---------- Flexible column matching (handles SAP export header variations) ----------
const norm = (s) => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
function pick(row, candidates) {
  const keys = Object.keys(row);
  for (const cand of candidates) {
    const target = norm(cand);
    const found = keys.find((k) => norm(k) === target);
    if (found && String(row[found]).trim() !== '') return row[found];
  }
  return undefined;
}

// ---------- Export to Excel / PDF (reusable across every tab) ----------
const escHtml = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// Both take the SAME already-filtered "rows" array a tab is currently displaying — whatever
// the universal filter, search box, or date range currently has selected — so the export
// always matches what's on screen, not the full unfiltered dataset. `columns` is
// [{ key, label }] controlling which fields export and their column headers/order.
function exportToExcel(rows, columns, filename) {
  const data = rows.map(r => {
    const obj = {};
    columns.forEach(c => { obj[c.label] = r[c.key] ?? ''; });
    return obj;
  });
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Data');
  XLSX.writeFile(wb, filename);
}
// Builds a separate, plain, print-ready document from the data directly (not the live page),
// so it's unaffected by the tables' virtual scrolling — every filtered row is included, not
// just whichever ~25 rows happen to be rendered on screen at that moment. Uses the browser's
// own Print dialog ("Save as PDF" destination) rather than a bundled PDF library.
function exportToPDF(title, subtitle, rows, columns) {
  const win = window.open('', '_blank');
  if (!win) { alert('Please allow pop-ups for this site to export a PDF.'); return; }
  const esc = escHtml;
  const headerHtml = columns.map(c => `<th>${esc(c.label)}</th>`).join('');
  const rowsHtml = rows.map(r => `<tr>${columns.map(c => `<td>${esc(r[c.key])}</td>`).join('')}</tr>`).join('');
  win.document.write(`<!DOCTYPE html><html><head><title>${esc(title)}</title><style>
    body { font-family: Arial, Helvetica, sans-serif; padding: 24px; color: #111; }
    h1 { font-size: 18px; margin: 0 0 2px; }
    .sub { color: #555; font-size: 12px; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 10.5px; }
    th, td { border: 1px solid #ccc; padding: 4px 6px; text-align: left; white-space: nowrap; }
    th { background: #f0f0f0; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
    tr { break-inside: avoid; }
    @media print { body { padding: 8px; } }
  </style></head><body>
    <h1>${esc(title)}</h1>
    <div class="sub">${esc(subtitle)}</div>
    <table><thead><tr>${headerHtml}</tr></thead><tbody>${rowsHtml}</tbody></table>
    <script>window.onload = () => { window.print(); };<\/script>
  </body></html>`);
  win.document.close();
}
// PM Schedule's Gantt view exported as an actual visual timeline, not a flat table — reuses
// the exact same date-to-position math as the live interactive Gantt (dayOfYear/totalDays),
// so bar positions in the PDF match what's shown on screen exactly.
function exportGanttToPDF(ganttData, subtitle) {
  const { year, leap, totalDays, withMeta } = ganttData;
  const win = window.open('', '_blank');
  if (!win) { alert('Please allow pop-ups for this site to export a PDF.'); return; }
  const esc = escHtml;
  const barColor = { none: '#2DD4BF', warning: '#FBBF24', critical: '#FB7185' };
  const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const monthDayCounts = MONTH_DAYS.map((d, i) => d + (i === 1 && leap ? 1 : 0));
  const monthWidths = monthDayCounts.map(d => d / totalDays * 100);
  // Cumulative left offset of each month boundary, reused for both the header gridlines and
  // the same gridlines repeated through every row — this is the same reference scale already
  // shown on the live dashboard's Gantt (month columns + day-1/10/20 tick marks).
  let cum = 0;
  const monthStarts = monthWidths.map(w => { const s = cum; cum += w; return s; });
  // Gridlines at each month boundary, replicated through every row (matching the live
  // dashboard's Gantt). Months vary in length (28-31 days), so a single repeating pattern
  // won't align past the second month — instead this layers one thin vertical-line gradient
  // per exact boundary position, which handles uneven month widths correctly.
  const boundaries = monthStarts.slice(1);
  const gridBackground = boundaries.length
    ? `background-image: ${boundaries.map(() => 'linear-gradient(#ddd, #ddd)').join(', ')};
       background-position: ${boundaries.map(pct => `${pct.toFixed(3)}% 0`).join(', ')};
       background-size: 1px 100%; background-repeat: no-repeat;`
    : '';
  const grouped = withMeta.reduce((acc, s) => { (acc[s.equipmentId] = acc[s.equipmentId] || []).push(s); return acc; }, {});
  const rowsHtml = Object.entries(grouped).map(([equipmentId, tasks]) => {
    const cells = tasks.map(s => {
      const left = (dayOfYear(s.startDate, leap) - 1) / totalDays * 100;
      const width = Math.max((dayOfYear(s.endDate, leap) - dayOfYear(s.startDate, leap) + 1) / totalDays * 100, 0.4);
      // Short date label (no year — the year is already in the page title) sits directly
      // above its own bar, so it stays attached to the exact task it belongs to even when
      // one equipment has many occurrences, instead of piling up as a block of text.
      const shortStart = formatDate(s.startDate).slice(0, 5);
      const shortEnd = formatDate(s.endDate).slice(0, 5);
      const label = shortStart === shortEnd ? shortStart : `${shortStart}→${shortEnd}`;
      return `<div style="position:absolute; left:${left}%; width:${width}%; top:9px; height:10px; background:${barColor[s.severity]}; border-radius:2px;" title="${esc(s.natureOfWork)}"></div>
        <div style="position:absolute; left:${left}%; top:0; font-size:6.5px; color:#555; white-space:nowrap;">${label}</div>`;
    }).join('');
    return `<tr>
      <td style="font-size:9.5px; padding:3px 6px; border:1px solid #ccc; vertical-align:top; overflow:hidden;">
        <div style="font-weight:bold; font-family:monospace;">${esc(equipmentId)}</div>
        <div style="color:#555;">${esc(tasks[0].description)}</div>
      </td>
      <td style="position:relative; border:1px solid #ccc; padding:0; overflow:hidden; ${gridBackground}"><div style="position:relative; height:20px;">${cells}</div></td>
    </tr>`;
  }).join('');
  const monthHeaderHtml = monthNames.map((m, i) =>
    `<div style="width:${monthWidths[i].toFixed(3)}%; text-align:center; font-size:9px; border-left:1px solid #ccc;">${m}</div>`
  ).join('');
  const dayTickHtml = monthDayCounts.map((days, i) =>
    `<div style="width:${monthWidths[i].toFixed(3)}%; position:relative; height:12px; border-left:1px solid #eee;">${[1, 10, 20].map(t =>
      `<span style="position:absolute; left:${((t - 1) / days * 100).toFixed(2)}%; font-size:6.5px; color:#999;">${t}</span>`).join('')}</div>`
  ).join('');
  win.document.write(`<!DOCTYPE html><html><head><title>Preventive Maintenance Schedule Gantt ${year}</title><style>
    body { font-family: Arial, Helvetica, sans-serif; padding: 20px; color: #111; }
    h1 { font-size: 16px; margin: 0 0 2px; }
    .sub { color: #555; font-size: 11px; margin-bottom: 10px; }
    /* table-layout:fixed forces columns to the widths declared on <col> below rather than
       trying to measure content — needed because the timeline column's only content is
       absolutely-positioned bars, which auto-layout can't measure and would collapse to 0. */
    table { width: 100%; table-layout: fixed; border-collapse: collapse; }
    .legend span.sw { display:inline-block; width:10px; height:10px; margin-right:4px; border-radius:2px; vertical-align:middle; }
    tr { break-inside: avoid; }
    .timeline-header { display:flex; }
    /* Chrome's Print dialog strips background colors by default (the "Background graphics"
       checkbox, off by default) — this forces bars and gridlines to print regardless of that setting. */
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
    @media print { body { padding: 6px; } }
  </style></head><body>
    <h1>Preventive Maintenance Schedule — Gantt (${year})</h1>
    <div class="sub">${esc(subtitle)}</div>
    <div class="legend" style="font-size:10px; margin-bottom:8px;">
      <span class="sw" style="background:${barColor.none}"></span> No conflict &nbsp;&nbsp;
      <span class="sw" style="background:${barColor.warning}"></span> Overlaps another schedule &nbsp;&nbsp;
      <span class="sw" style="background:${barColor.critical}"></span> Critical (same equipment or major machine)
    </div>
    <div style="display:flex;"><div style="width:210px;"></div><div class="timeline-header" style="flex:1;">${monthHeaderHtml}</div></div>
    <div style="display:flex; margin-bottom:2px;"><div style="width:210px;"></div><div class="timeline-header" style="flex:1;">${dayTickHtml}</div></div>
    <table>
      <colgroup><col style="width:210px;" /><col /></colgroup>
      <tbody>${rowsHtml}</tbody>
    </table>
    <script>window.onload = () => { window.print(); };<\/script>
  </body></html>`);
  win.document.close();
}
// PM Schedule's Gantt as an Excel "colored grid" approximation — a real Excel chart object
// isn't achievable with the plain data-writing library already used here, so this uses a
// week-by-week symbol grid instead (X = scheduled, ! = overlap, C = critical), which is
// guaranteed to render correctly in any version of Excel, unlike cell background colors.
function exportGanttToExcel(ganttData, filename) {
  const { year, leap, totalDays, withMeta } = ganttData;
  const weekCount = Math.ceil(totalDays / 7);
  const weekLabels = Array.from({ length: weekCount }, (_, i) => `Wk${i + 1}`);
  const grouped = withMeta.reduce((acc, s) => { (acc[s.equipmentId] = acc[s.equipmentId] || []).push(s); return acc; }, {});
  const aoa = [
    [`Preventive Maintenance Schedule Gantt (${year}) — X = scheduled, ! = overlaps another schedule, C = critical (same equipment or major machine)`],
    [],
    ['Equipment ID', 'Description', 'Section', 'Scheduled Dates', ...weekLabels],
  ];
  Object.entries(grouped).forEach(([equipmentId, tasks]) => {
    const cells = new Array(weekCount).fill('');
    tasks.forEach(s => {
      const startWeek = Math.floor((dayOfYear(s.startDate, leap) - 1) / 7);
      const endWeek = Math.floor((dayOfYear(s.endDate, leap) - 1) / 7);
      const symbol = s.severity === 'critical' ? 'C' : s.severity === 'warning' ? '!' : 'X';
      for (let w = Math.max(0, startWeek); w <= Math.min(weekCount - 1, endWeek); w++) {
        if (cells[w] !== 'C') cells[w] = (symbol === 'C' || cells[w] !== '!') ? symbol : cells[w];
      }
    });
    // The week-grid alone doesn't show actual dates — this column spells them out explicitly.
    const dateRanges = tasks.map(s => `${formatDate(s.startDate)}→${formatDate(s.endDate)}`).join('; ');
    aoa.push([equipmentId, tasks[0].description, tasks[0].section, dateRanges, ...cells]);
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Gantt');
  XLSX.writeFile(wb, filename);
}
// Small paired buttons dropped into any tab — pass the tab's currently-filtered rows and the
// columns to export; everything else (filenames, print layout) is handled consistently.
function ExportButtons({ rows, columns, baseName, title, subtitle }) {

        title="Export the currently filtered rows to PDF (opens Print — choose Save as PDF)"

}


function parseSpreadsheetFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
        // Some workbooks keep multiple year/version sheets (e.g. an old "YR2022" tab alongside
        // the current "YR2026" one). Rather than assume the first sheet is the right one, pick
        // whichever sheet actually has the most rows of data.
        let bestName = wb.SheetNames[0], bestRows = -1;
        for (const name of wb.SheetNames) {
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '' });
          if (rows.length > bestRows) { bestRows = rows.length; bestName = name; }
        }
        const sheet = wb.Sheets[bestName];
        const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        // Find the real header row: some exports have a title block (company name, report
        // title, blank rows) before the actual column headers. Use the first row within the
        // first 20 that has several non-empty cells as the header row.
        let headerIdx = 0;
        for (let i = 0; i < Math.min(20, raw.length); i++) {
          const nonEmpty = raw[i].filter(c => String(c).trim() !== '').length;
          if (nonEmpty >= 4) { headerIdx = i; break; }
        }
        let headers = raw[headerIdx].map(h => String(h).trim());
        let dataStart = headerIdx + 1;
        // Some exports split a header across two rows (a merged parent label like "PLANNED DATE"
        // in the header row, with the real sub-labels "BASIC START" / "END DATE" directly below).
        // If the row right after the header has only a handful of non-empty cells (far fewer than
        // the header row itself), treat it as a sub-header row: use its values in place of the
        // parent header wherever it has one, and start reading data one row further down.
        if (raw[dataStart]) {
          const nextRow = raw[dataStart];
          const nextNonEmpty = nextRow.filter(c => String(c).trim() !== '').length;
          const headerNonEmpty = headers.filter(h => h !== '').length;
          if (nextNonEmpty > 0 && nextNonEmpty <= 6 && nextNonEmpty < headerNonEmpty / 2) {
            headers = headers.map((h, idx) => {
              const sub = String(nextRow[idx] ?? '').trim();
              return sub !== '' ? sub : h;
            });
            dataStart += 1;
          }
        }
        const rows = raw.slice(dataStart)
          .filter(r => r.some(c => String(c).trim() !== ''))
          .map(r => {
            const obj = {};
            headers.forEach((h, idx) => {
              let v = r[idx] !== undefined ? r[idx] : '';
              if (v instanceof Date) v = v.toISOString().slice(0, 10);
              obj[h] = v;
            });
            return obj;
          });
        resolve(rows);
      } catch (err) {
        reject(err);
      }
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsArrayBuffer(file);
  });
}

// Catalog-specific parser: your technical document trackers store each document's server
// file path as a real Excel hyperlink on the Manual Code cell, not as a separate text column.
// The normal parser above only reads cell values (sheet_to_json), which silently drops
// hyperlinks — so this reads every sheet in the workbook cell-by-cell instead, capturing both
// the visible text and the hyperlink target for every row, and combines all sheets into one
// list (so e.g. a "Technical Document" sheet and a "WIRING DIAGRAM" sheet in the same workbook
// both come through, tagged with which sheet they came from).
function parseCatalogFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
        const allRows = [];
        wb.SheetNames.forEach((sheetName) => {
          const sheet = wb.Sheets[sheetName];
          if (!sheet['!ref']) return;
          const range = XLSX.utils.decode_range(sheet['!ref']);
          const grid = [];
          for (let r = range.s.r; r <= range.e.r; r++) {
            const row = [];
            for (let c = range.s.c; c <= range.e.c; c++) {
              const addr = XLSX.utils.encode_cell({ r, c });
              const cell = sheet[addr];
              let val = '', link = '';
              if (cell) {
                if (cell.v instanceof Date) val = cell.v.toISOString().slice(0, 10);
                else val = cell.v !== undefined ? String(cell.v) : '';
                if (cell.l && cell.l.Target) link = cell.l.Target;
              }
              row.push({ val, link });
            }
            grid.push(row);
          }
          if (grid.length < 2) return;
          let headerIdx = 0;
          for (let i = 0; i < Math.min(20, grid.length); i++) {
            const nonEmpty = grid[i].filter(c => String(c.val).trim() !== '').length;
            if (nonEmpty >= 3) { headerIdx = i; break; }
          }
          const headers = grid[headerIdx].map(c => String(c.val).trim());
          for (let r = headerIdx + 1; r < grid.length; r++) {
            const rowCells = grid[r];
            if (!rowCells.some(c => String(c.val).trim() !== '')) continue;
            const obj = { __sheet: sheetName, __link: '' };
            headers.forEach((h, idx) => {
              const cell = rowCells[idx];
              if (!cell) return;
              obj[h] = cell.val;
              if (cell.link && !obj.__link) obj.__link = cell.link;
            });
            allRows.push(obj);
          }
        });
        resolve(allRows);
      } catch (err) {
        reject(err);
      }
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsArrayBuffer(file);
  });
}

// ---------- Sample seed data (stands in until a real export is uploaded) ----------

  BPS: 'Body Preparation', GPS: 'Glaze Preparation', PRS: 'Press', GLS: 'Glaze Line',
  KLN: 'Kiln', LGV: 'Guided Vehicle', TGV: 'Guided Vehicle', SOR: 'Sorting / Packing',
  CMP: 'Compressor', DTS: 'Development and Technical Services', LAB: 'Laboratory',
  CQC: 'Ceramics Quality Center', POL: 'Polishing', RMP: 'Raw Material Presentation',
  SNG: 'Synthetic Natural Gas', WTP: 'Water Treatment Plant', WWT: 'Waste Water Treatment',
  SUB: 'Substation',
};
const sectionLabel = (code) => SECTION_NAMES[code] ? `${code} — ${SECTION_NAMES[code]}` : code;

// Confirmed with Jijo: the real server location the catalog's relative Excel links
// ("Technical Documents\...") sit under. This is the piece missing from the Excel file itself —
// the hyperlinks only knew their path relative to wherever the Excel file was, not the actual
// server address, so we supply that base here and build a correct network file link from it.
const CATALOG_SERVER_BASE = 'RDFA2-SV-LAB01/Shares/FA2-TechServices/Technical Documentation';
function buildCatalogLink(relativePath) {
  if (!relativePath) return '';
  let normalized = String(relativePath).replace(/\\/g, '/').replace(/^\/+/, '');
  // Excel already stores some hyperlink targets percent-encoded (spaces as "%20"). Decode first
  // so we don't encode on top of that — otherwise "%20" becomes "%2520", a broken address.
  try { normalized = decodeURIComponent(normalized); } catch (e) { /* wasn't encoded, use as-is */ }
  const full = `${CATALOG_SERVER_BASE}/${normalized}`;
  return 'file://' + full.split('/').map(encodeURIComponent).join('/');
}

function formatDate(isoStr) {
  if (!isoStr || isoStr === '-') return isoStr;
  const m = String(isoStr).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return isoStr;
  const [, y, mo, d] = m;
  return `${d}-${mo}-${y}`;
}

const FULL_MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function formatDateLong(isoStr) {
  if (!isoStr) return '-';
  const m = String(isoStr).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return isoStr;
  const [, y, mo, d] = m;
  return `${parseInt(d, 10)} ${FULL_MONTH_NAMES[parseInt(mo, 10) - 1]} ${y}`;
}
function monthsBetween(fromISO, toISO) {
  const [fy, fm] = fromISO.split('-').map(Number);
  const [ty, tm] = toISO.split('-').map(Number);
  if (!fy || !ty) return 0;
  return Math.max(0, (ty - fy) * 12 + (tm - fm));
}

// ---------- PM Schedule projection engine ----------
// Parses an interval like "24 MONTHS" or "15 DAYS" into a structured step, so a next-due date
// can be calculated by adding it to a real anchor date. Returns null for anything unrecognized
// (e.g. blank/unusual interval text), so that chain is simply skipped rather than guessed at.
function parseInterval(intervalStr) {
  const m = String(intervalStr || '').trim().match(/^(\d+)\s*(day|days|week|weeks|month|months|year|years)$/i);
  if (!m) return null;
  const n = parseInt(m[1], 10);
  const unit = m[2].toLowerCase();
  if (unit.startsWith('day')) return { unit: 'days', n };
  if (unit.startsWith('week')) return { unit: 'days', n: n * 7 };
  if (unit.startsWith('month')) return { unit: 'months', n };
  return { unit: 'months', n: n * 12 }; // years
}
function daysBetweenISO(a, b) {
  const [ay, am, ad] = a.split('-').map(Number);
  const [by, bm, bd] = b.split('-').map(Number);
  return Math.round((Date.UTC(by, bm - 1, bd) - Date.UTC(ay, am - 1, ad)) / 86400000);
}
function addDaysISO(iso, days) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() + days);
  return dt.toISOString().slice(0, 10);
}
// Adds a parsed interval to an ISO date. For months, keeps the same day-of-month where
// possible but clamps to the target month's real last day (e.g. 31 Jan + 1 month -> 28/29 Feb,
// never an invalid "31 Feb").
function addInterval(isoDate, interval) {
  if (interval.unit === 'days') return addDaysISO(isoDate, interval.n);
  const [y, m, d] = isoDate.split('-').map(Number);
  const totalMonths = (y * 12 + (m - 1)) + interval.n;
  const ny = Math.floor(totalMonths / 12);
  const nm = totalMonths % 12;
  const lastDayOfTargetMonth = new Date(Date.UTC(ny, nm + 1, 0)).getUTCDate();
  const nd = Math.min(d, lastDayOfTargetMonth);
  return `${ny}-${String(nm + 1).padStart(2, '0')}-${String(nd).padStart(2, '0')}`;
}
// Same machine + same task type = one recurring chain to project forward independently
// (e.g. a kiln's "TESTING" every 15 days is a separate chain from its own "FULL G.O." every
// 24 months — each needs its own anchor and its own interval).
function pmChainKey(s) { return `${s.equipmentId}::${s.natureOfWork}`; }
const PM_PROJECT_THROUGH = '2030-12-31';
// Generates the missing future occurrences (through end of 2030) for every machine+task chain.
// Anchored ONLY on real/confirmed data — never on a previous unconfirmed projection — so this
// is safe to recompute fresh on every render: editing or confirming an earlier date naturally
// cascades forward through everything still projected after it, and already-confirmed rows
// (which live permanently in pmSchedule, not here) are never touched or regenerated.
function generateProjectedRows(pmSchedule) {
  const chains = new Map();
  pmSchedule.forEach(s => {
    const key = pmChainKey(s);
    if (!chains.has(key)) chains.set(key, []);
    chains.get(key).push(s);
  });
  const newRows = [];
  chains.forEach(rows => {
    const anchorCandidates = rows.filter(s => s.origin !== 'projected' || s.confirmed);
    if (!anchorCandidates.length) return;
    let anchor = anchorCandidates.reduce((a, b) => (b.startDate > a.startDate ? b : a));
    const interval = parseInterval(anchor.interval);
    if (!interval) return; // can't safely project without a recognizable interval
    const existingDates = new Set(rows.map(s => s.startDate));
    const spanDays = Math.max(0, daysBetweenISO(anchor.startDate, anchor.endDate || anchor.startDate));
    let cursor = anchor;
    let guard = 0;
    while (guard++ < 60) { // hard safety cap so a bad/zero interval can never loop forever
      const nextStart = addInterval(cursor.startDate, interval);
      if (nextStart > PM_PROJECT_THROUGH || nextStart <= cursor.startDate) break;
      if (!existingDates.has(nextStart)) {
        const newRow = {
          ...anchor,
          startDate: nextStart,
          endDate: addDaysISO(nextStart, spanDays),
          origin: 'projected',
          confirmed: false,
          sourceRemarks: '',
        };
        newRows.push(newRow);
        existingDates.add(nextStart);
        cursor = newRow;
      } else {
        // A real/confirmed row already exists at that date — continue projecting from it.
        cursor = rows.find(s => s.startDate === nextStart) || { ...cursor, startDate: nextStart };
      }
    }
  });
  return newRows;
}

// Confirmed Plant -> Cost Center grouping, worked out together against the actual WCCC org chart.

// Short plant-code form (TL01, TL06, FR02...) derived from a Cost Center — used so

const ALL_KNOWN_PLANT_CODES = ['TL01', 'TL02', 'TL03', 'TL04', 'TL05', 'TL06', 'FR01', 'FR02'];

// ---------- Utility Bills: parsing & distribution helpers ----------
// SAP-adjacent utility exports sometimes write "181,714,19" when they mean "181,714.19"
// (a comma typo where the decimal point should be). If a value has no period at all and
// 2+ commas, treat the last comma as the decimal point rather than a thousands separator.
function parseMoneyStr(v) {
  if (v === undefined || v === null || v === '') return 0;
  if (typeof v === 'number') return v;
  let s = String(v).trim();
  if (!s || s.toUpperCase() === 'NA') return 0;
  if (!s.includes('.')) {
    const commaCount = (s.match(/,/g) || []).length;
    if (commaCount >= 2) {
      const lastComma = s.lastIndexOf(',');
      s = s.slice(0, lastComma) + '.' + s.slice(lastComma + 1);
    }
  }
  s = s.replace(/,/g, '');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function monthLabelToKey(label) {
  // Diesel sometimes splits a month into two half-month bills, e.g. "JUNE (01-15) 2025" and
  // "JUNE (16-30) 2025" — strip the day-range parenthetical first so both halves resolve to
  // the same "2025-06" key and get merged, instead of showing up as two separate garbage entries.
  const cleaned = String(label).toUpperCase().replace(/\([^)]*\)/g, ' ');
  const m = cleaned.match(/([A-Z]+)\D*(\d{4})/);
  if (!m) return String(label).trim();
  // Match by first-3-letters (JUL, JUN) as well as full names (JULY, JUNE) — some sections in
  // the Bill Summary abbreviate month headers inconsistently with the rest of the file, and a
  // strict full-name match was silently dropping data for those months entirely.
  const abbr = m[1].slice(0, 3);
  const monthIdx = FULL_MONTH_NAMES.findIndex(mn => mn.slice(0, 3).toUpperCase() === abbr);
  if (monthIdx < 0) return String(label).trim();
  return `${m[2]}-${String(monthIdx + 1).padStart(2, '0')}`;
}
function monthKeyLabel(key) {
  const m = String(key).match(/^(\d{4})-(\d{2})$/);
  if (!m) return key;
  return `${FULL_MONTH_NAMES[parseInt(m[2], 10) - 1]} ${m[1]}`;
}

// Parses a sheet name like "Jan-25", "April-26", "July-26" into a "YYYY-MM" key. The
// multi-month allocation workbooks aren't consistent about abbreviated vs. full month
// names, so this matches on the first 3 letters and accepts a 2-digit year.
function parseMonthSheetName(name) {
  const m = String(name).trim().match(/^([A-Za-z]+)[\s-]?(\d{2,4})$/);
  if (!m) return null;
  const abbr = m[1].slice(0, 3).toUpperCase();
  const idx = FULL_MONTH_NAMES.findIndex(mn => mn.slice(0, 3).toUpperCase() === abbr);
  if (idx < 0) return null;
  let year = parseInt(m[2], 10);
  if (year < 100) year += 2000;
  return `${year}-${String(idx + 1).padStart(2, '0')}`;
}

// Reads the monthly "Bill Summary" workbook, which stacks several utility sections
// (NGDC/Gas, Industrial Water, Electricity, Drinking Water, Diesel) one below another in a
// single sheet, each with its own SL.NO/Plant/Meter-ID header and a variable number of
// monthly Quantity+Price column pairs. Some exports split this across multiple year sheets
// (e.g. "2025" and "2026") in one workbook — every sheet except "Total" is read and merged,
// matching meters by their id within each section type so a meter's monthly history spans
// however many year-sheets it appears in. Returns [{ type, meters: [{ id, plantLabel, monthly:{key:{qty,price}} }] }].
function parseBillSummaryFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
        const sectionsByType = {}; // type -> Map(id -> meter)
        for (const sheetName of wb.SheetNames) {
          if (/^total$/i.test(sheetName.trim())) continue;
          const raw = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '' });
          let i = 0;
          while (i < raw.length) {
            const row = raw[i];
            const firstCell = String(row[0] ?? '').trim();
            const restEmpty = row.slice(1).every(c => String(c).trim() === '');
            if (firstCell && restEmpty && firstCell.length > 2 && firstCell === firstCell.toUpperCase() && /[A-Z]/.test(firstCell)) {
              const type = firstCell;
              const headerRow = raw[i + 1] || [];
              const monthCols = [];
              for (let c = 3; c < headerRow.length; c++) {
                const label = String(headerRow[c] ?? '').trim();
                if (label) monthCols.push({ key: monthLabelToKey(label), qtyIdx: c, priceIdx: c + 1 });
              }
              if (!sectionsByType[type]) sectionsByType[type] = new Map();
              const metersById = sectionsByType[type];
              let r = i + 3;
              let lastMeterId = null;
              while (r < raw.length) {
                const dr = raw[r];
                if (!dr.some(c => String(c).trim() !== '')) break;
                const idCell = dr[2];
                const plantCell = dr[1];
                const hasId = idCell !== undefined && String(idCell).trim() !== '';
                const hasPlant = plantCell !== undefined && String(plantCell).trim() !== '';
                let meter = null;
                if (hasId || hasPlant) {
                  // A row is its own distinct entry if it has EITHER a real meter id OR its own
                  // Plant name — Diesel shares one company-wide Material No across all plants,
                  // with the plant name being the only thing that distinguishes each row, so
                  // checking id alone (as Gas SKIDs need) would wrongly merge every plant into one.
                  const key = hasId ? String(idCell).trim() : String(plantCell).trim();
                  lastMeterId = key;
                  if (!metersById.has(key)) metersById.set(key, { id: key, plantLabel: hasPlant ? String(plantCell).trim() : '', monthly: {} });
                  meter = metersById.get(key);
                } else if (lastMeterId && metersById.has(lastMeterId)) {
                  // True continuation row: both Plant and Material No are blank — this is a
                  // second invoice line for the same meter (merged cells), not a new plant.
                  meter = metersById.get(lastMeterId);
                }
                if (meter) {
                  monthCols.forEach(({ key, qtyIdx, priceIdx }) => {
                    if (!meter.monthly[key]) meter.monthly[key] = { qty: 0, price: 0 };
                    meter.monthly[key].qty += parseMoneyStr(dr[qtyIdx]);
                    meter.monthly[key].price += parseMoneyStr(dr[priceIdx]);
                  });
                }
                r++;
              }
              i = r + 1;
            } else {
              i++;
            }
          }
        }
        const sections = Object.entries(sectionsByType).map(([type, metersById]) => ({ type, meters: [...metersById.values()] }));
        resolve(sections);
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsArrayBuffer(file);
  });
}

// Picks the sheet most likely to hold the real data table: prefers a sheet containing the
// given anchor header text (avoids being fooled by a near-duplicate sheet with stray
// formatting that inflates its apparent row count), falling back to the sheet with the most rows.
function pickDataSheet(wb, anchorText) {
  let bestName = wb.SheetNames[0], bestRows = -1, anchorName = null;
  for (const name of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '' });
    if (rows.length > bestRows) { bestRows = rows.length; bestName = name; }
    if (!anchorName && anchorText && rows.some(r => r.some(c => String(c).trim() === anchorText))) anchorName = name;
  }
  return anchorName || bestName;
}

// Normalizes a header cell for loose matching (case/whitespace-insensitive), so column
// detection survives the real-world typos found in these files (e.g. "Waster Water").
const normHeader = (s) => String(s || '').toUpperCase().replace(/[^A-Z]/g, '');

// Reads the Gas/Water/Waste-Water Cost-Center allocation workbook: one sheet per month, but
// the column layout genuinely shifts across the year (Jan-Jul 2025 includes Electricity +
// SAR sub-columns; Aug-Nov 2025 is percentages-only including Electricity; Dec-2025 onward
// drops Electricity, which moved to its own file). Rather than assume fixed column indices,
// each sheet's header row is scanned independently to find where each utility type actually
// sits that month. Returns { byMonth: { 'YYYY-MM': { rows, hasElecPct } }, months: [...] }.
function parseGasWaterAllocFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
        const byMonth = {};
        for (const sheetName of wb.SheetNames) {
          const raw = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '' });
          const headerIdx = raw.findIndex(r => r.some(c => normHeader(c) === 'COSTCENTER'));
          if (headerIdx < 0) continue;
          const headerRow = raw[headerIdx];
          let ccCol = -1, nameCol = -1, gasCol = -1, waterCol = -1, wasteCol = -1, elecCol = -1;
          headerRow.forEach((cell, idx) => {
            const h = normHeader(cell);
            if (h === 'COSTCENTER') ccCol = idx;
            else if (h === 'GENERALNAME') nameCol = idx;
            else if (h.includes('WAST') && h.includes('WATER')) wasteCol = idx;
            else if (h === 'WATER') waterCol = idx;
            else if (h === 'GAS') gasCol = idx;
            else if (h.includes('ELECTRIC')) elecCol = idx;
          });
          if (ccCol < 0) continue;
          // Month comes from the sheet name (e.g. "Jul-25") — proved 100% reliable across every
          // real sheet tested. An earlier version preferred a Date cell found in the sheet, but
          // that path was fragile and produced wrong/missing months in practice, so it's dropped.
          const monthKey = parseMonthSheetName(sheetName);
          if (!monthKey) continue;
          const rows = [];
          for (let r = headerIdx + 2; r < raw.length; r++) {
            const dr = raw[r];
            const ccRaw = String(dr[ccCol] ?? '').trim();
            // Real Cost Centers are plain digit strings. Some sheets include human-added
            // "TOTAL Plant X" checksum rows using a placeholder like "1000-200" in this same
            // column — stripping the hyphen would turn that into a fake-but-valid-looking
            // 7-digit Cost Center and silently double-count that plant's whole allocation.
            // A real value never contains a hyphen (or letters), so reject those outright,
            // and also skip anything whose own label says it's a totals/summary row.
            if (/[a-zA-Z-]/.test(ccRaw)) continue;
            const generalNameRaw = nameCol >= 0 ? String(dr[nameCol] ?? '').trim() : '';
            if (/^TOTAL\b/i.test(generalNameRaw)) continue;
            const cc = ccRaw.replace(/\D/g, '');
            if (cc.length < 4) continue;
            rows.push({
              costCenter: cc,
              generalName: generalNameRaw,
              gasPct: gasCol >= 0 ? (Number(dr[gasCol]) || 0) : 0,
              waterPct: waterCol >= 0 ? (Number(dr[waterCol]) || 0) : 0,
              wasteWaterPct: wasteCol >= 0 ? (Number(dr[wasteCol]) || 0) : 0,
              elecPct: elecCol >= 0 ? (Number(dr[elecCol]) || 0) : null,
            });
          }
          if (rows.length) byMonth[monthKey] = { rows, hasElecPct: elecCol >= 0 };
        }
        resolve({ byMonth, months: Object.keys(byMonth).sort() });
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsArrayBuffer(file);
  });
}

// Reads the Electricity Cost-Center distribution workbook: one sheet per month (from
// Dec-2025 onward — earlier months only have a single combined Electricity % inside the
// Gas/Water/Waste-Water file, handled separately). Each meter is its own column; the SADDAD
// number(s) that meter bills against are embedded in the column header text (e.g.
// "25476\n30010489551\nLoad (%)", or "8236 + 8055\n30096765703 + 30097253451\nLoad (%)" for
// TL06's two combined feeders), so meters are matched by extracting those digit strings
// rather than by column position, which can shift between monthly files. Sheets that don't
// parse into a real month (e.g. a legacy leftover tab) are skipped.
function parseElectricityAllocFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
        const byMonth = {};
        for (const sheetName of wb.SheetNames) {
          const monthKey = parseMonthSheetName(sheetName);
          if (!monthKey) continue;
          const raw = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '' });
          const headerIdx = raw.findIndex(r => r.some(c => normHeader(c) === 'COSTCENTER'));
          if (headerIdx < 0) continue;
          const headerRow = raw[headerIdx];
          // Column positions detected by header text rather than hardcoded index — the sheet's
          // real data can start at column B instead of A (no padding column), which silently
          // shifts every fixed index by one and was why Cost Center was reading Work Center's
          // values instead. Meter columns were already found this way; Plant/Cost Center/
          // Description now are too, for the same reason.
          let plantCol = -1, ccCol = -1, descCol = -1;
          headerRow.forEach((cell, idx) => {
            const h = normHeader(cell);
            if (h === 'COSTCENTER') ccCol = idx;
            else if (h === 'PLANT' && plantCol < 0) plantCol = idx;
            else if (h === 'DESCRIPTION') descCol = idx;
          });
          if (ccCol < 0) continue;
          const meterCols = [];
          headerRow.forEach((cellVal, idx) => {
            const ids = String(cellVal || '').match(/\d{8,}/g);
            if (ids && ids.length) meterCols.push({ colIdx: idx, saddadIds: ids });
          });
          const rows = [];
          for (let r = headerIdx + 1; r < raw.length; r++) {
            const dr = raw[r];
            const ccRaw = String(dr[ccCol] ?? '').trim();
            // Same guard as the Gas/Water Allocation parser — a real Cost Center never contains
            // a hyphen or letters; reject anything that does before stripping non-digits, so a
            // placeholder like "1000-200" on a "TOTAL Plant X" checksum row can't be silently
            // treated as a real (and heavily over-weighted) Cost Center.
            if (/[a-zA-Z-]/.test(ccRaw)) continue;
            const descRaw = descCol >= 0 ? String(dr[descCol] ?? '').trim() : '';
            if (/^TOTAL\b/i.test(descRaw)) continue;
            const cc = ccRaw.replace(/\D/g, '');
            if (cc.length < 4) continue;
            const loads = {};
            meterCols.forEach(({ colIdx, saddadIds }) => {
              const v = Number(dr[colIdx]);
              if (dr[colIdx] !== '' && !isNaN(v)) loads[saddadIds.join('+')] = v;
            });
            rows.push({ plant: plantCol >= 0 ? String(dr[plantCol] ?? '').trim() : '', costCenter: cc, description: descRaw, loads });
          }
          if (rows.length) byMonth[monthKey] = { meterCols, rows };
        }
        resolve({ byMonth, months: Object.keys(byMonth).sort() });
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsArrayBuffer(file);
  });
}

// ---------- Gantt / overlap helpers ----------
function rangesOverlap(aStart, aEnd, bStart, bEnd) {
  return aStart <= bEnd && bStart <= aEnd;
}
function isLeapYear(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
const MONTH_DAYS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
function dayOfYear(dateStr, leap) {
  const [y, m, d] = String(dateStr).split('-').map(Number);
  if (!y || !m || !d) return 1;
  let days = d;
  for (let i = 0; i < m - 1; i++) days += MONTH_DAYS[i] + (i === 1 && leap ? 1 : 0);
  return days;
}

function toTitleCase(str) {
  if (!str) return str;
  const lower = new Set(['a', 'an', 'and', 'as', 'at', 'but', 'by', 'for', 'in', 'of', 'on', 'or', 'the', 'to', 'with']);
  return String(str)
    .toLowerCase()
    .split(' ')
    .map((word, i) => {
      if (word === '') return word;
      if (i > 0 && lower.has(word)) return word;
      return word.charAt(0).toUpperCase() + word.slice(1);
    })
    .join(' ');
}

// Collapses values that only differ by case or stray whitespace (e.g. "Declaration of Conformity"

// they don't show up as separate near-duplicate entries in filter dropdowns. Genuinely different
// values (e.g. "DRAWING" vs "DRAWINGS") are left as-is since they're not the same thing.
function normalizeLabel(str) {
  if (!str) return str;
  return String(str).replace(/\s+/g, ' ').trim().toUpperCase();
}

function UploadZone({ label, hint, mapRow, onMapped, parseFn }) {
  const role = React.useContext(RoleContext);
  const [dragOver, setDragOver] = useState(false);
  const [status, setStatus] = useState(null); // { fileName, totalRows, matchedRows, headers, error }

  if (role !== 'Admin') {
    return (
      <div className="border border-dashed rounded-md p-4 border-[#2A313A] bg-[#14181D] opacity-70">
        <div className="flex items-center gap-3">
          <Upload size={18} className="text-[#5A6570] shrink-0" strokeWidth={1.75} />
          <div className="flex-1 min-w-0">
            <div className="text-sm text-[#8B95A1] font-medium">{label}</div>
            <div className="text-[11px] text-[#5A6570]">View only — uploading requires Admin access</div>
          </div>
        </div>
      </div>
    );
  }

  const handleFile = useCallback(async (file) => {
    if (!file) return;
    try {
      const rawRows = await (parseFn || parseSpreadsheetFile)(file);
      const headers = rawRows.length ? Object.keys(rawRows[0]) : [];
      const mapped = rawRows.map(mapRow).filter(Boolean);
      setStatus({ fileName: file.name, totalRows: rawRows.length, matchedRows: mapped.length, headers, error: null });
      if (mapped.length) onMapped(mapped);
    } catch (err) {
      setStatus({ fileName: file.name, error: err.message || 'Could not read this file' });
    }
  }, [mapRow, onMapped, parseFn]);

  const ok = status && !status.error && status.matchedRows > 0;
  const problem = status && (status.error || status.matchedRows === 0);

  return (
    <div
      onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
      onDragLeave={() => setDragOver(false)}
      onDrop={(e) => { e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files[0]); }}
      className={`border border-dashed rounded-md p-4 transition-colors ${dragOver ? 'border-[#4FD1C5] bg-[#4FD1C5]/5' : problem ? 'border-rose-400/50 bg-rose-400/5' : 'border-[#2A313A] bg-[#14181D]'}`}
    >
      <div className="flex items-center gap-3">
        {ok ? <CheckCircle2 size={18} className="text-teal-400 shrink-0" strokeWidth={1.75} /> : <Upload size={18} className="text-[#4FD1C5] shrink-0" strokeWidth={1.75} />}
        <div className="flex-1 min-w-0">
          <div className="text-sm text-[#D5D9DD] font-medium">{label}</div>
          <div className="text-[11px] text-[#7A8590] truncate">
            {!status && hint}
            {status && status.error && <span className="text-rose-400">{status.fileName}: {status.error}</span>}
            {status && !status.error && status.matchedRows > 0 && <span className="text-teal-400">{status.fileName}: matched {status.matchedRows} of {status.totalRows} rows</span>}
            {status && !status.error && status.matchedRows === 0 && <span className="text-amber-400">{status.fileName}: found {status.totalRows} rows but couldn't match any columns</span>}
          </div>
        </div>
        <label className="text-xs font-medium px-3 py-1.5 rounded-sm bg-[#232A32] hover:bg-[#2A323C] text-[#C4CBD2] cursor-pointer shrink-0 transition-colors">
          Choose file
          <input type="file" accept=".csv,.xlsx,.xls" className="hidden" onChange={(e) => handleFile(e.target.files[0])} />
        </label>
      </div>
      {problem && !status.error && (
        <div className="mt-3 pt-3 border-t border-[#2A313A] text-[11px] text-[#8B95A1]">
          <div className="mb-1">Columns detected in your file:</div>
          <div className="flex flex-wrap gap-1">
            {status.headers.map((h, i) => <Pill key={i} className="text-[#B8C0C8] border-[#2A313A] bg-[#0E1114]">{h}</Pill>)}
          </div>
          <div className="mt-2">Tell me these names and I'll match the dashboard's fields to them.</div>
        </div>
      )}
    </div>
  );
}

// Compact uploader for the three Utility Bills files, whose parsers each return a different
// shaped result (not a flat row array like UploadZone expects) — same visual language
// (dashed box -> teal checkmark line once loaded) but wired to a custom parseFn/summarize pair.
function CompactUpload({ label, hint, parseFn, onLoaded, summarize }) {
  const [dragOver, setDragOver] = useState(false);
  const [status, setStatus] = useState(null); // { fileName, error, summaryText }

  const handleFile = useCallback(async (file) => {
    if (!file) return;
    try {
      const result = await parseFn(file);
      const summaryText = summarize(result);
      setStatus({ fileName: file.name, error: null, summaryText });
      onLoaded(result);
    } catch (err) {
      setStatus({ fileName: file.name, error: err.message || 'Could not read this file' });
    }
  }, [parseFn, onLoaded, summarize]);

  const ok = status && !status.error;

  return (
    <div
      onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
      onDragLeave={() => setDragOver(false)}
      onDrop={(e) => { e.preventDefault(); setDragOver(false); handleFile(e.dataTransfer.files[0]); }}
      className={`border border-dashed rounded-md px-3 py-2.5 transition-colors ${dragOver ? 'border-[#4FD1C5] bg-[#4FD1C5]/5' : status?.error ? 'border-rose-400/50 bg-rose-400/5' : 'border-[#2A313A] bg-[#14181D]'}`}
    >
      <div className="flex items-center gap-2.5">
        {ok ? <CheckCircle2 size={16} className="text-teal-400 shrink-0" strokeWidth={1.75} /> : <Upload size={16} className="text-[#4FD1C5] shrink-0" strokeWidth={1.75} />}
        <div className="flex-1 min-w-0">
          <div className="text-[13px] text-[#D5D9DD] font-medium">{label}</div>
          <div className="text-[11px] text-[#7A8590] truncate">
            {!status && hint}
            {status?.error && <span className="text-rose-400">{status.fileName}: {status.error}</span>}
            {status && !status.error && <span className="text-teal-400">{status.fileName}: {status.summaryText}</span>}
          </div>
        </div>
        <label className="text-[11px] font-medium px-2.5 py-1 rounded-sm bg-[#232A32] hover:bg-[#2A323C] text-[#C4CBD2] cursor-pointer shrink-0 transition-colors">
          Choose file
          <input type="file" accept=".csv,.xlsx,.xls" className="hidden" onChange={(e) => handleFile(e.target.files[0])} />
        </label>
      </div>
    </div>
  );
}

// ---------- Local persistence (saved in this browser only, on this computer) ----------
// Uses IndexedDB rather than localStorage: localStorage caps out around 5-10MB total across
// every tab's data combined, which large datasets like Asset Master (10,000+ rows) can eat
// through on their own — leaving no room for whichever tab happens to save last (Catalog,
// Utility Bills), and failing completely silently. IndexedDB's limit is typically hundreds of
// MB, removing that ceiling. Any data already sitting in localStorage from before this change
// is copied over automatically the first time the app loads, so nothing already saved is lost.
const STORAGE_PREFIX = 'plantDashboard_';
const IDB_NAME = 'plantDashboardDB';
const IDB_STORE = 'kv';
const PERSISTED_KEYS = ['equipment', 'pm', 'catalog', 'utilityBillSummary', 'utilityGasAllocV2', 'utilityElecAllocV2', 'utilityMonth', 'pmSchedule', 'scheduleMeta', 'assetMaster', 'catalogDocs', 'hardCopyDocs', 'catalogMeta'];
let idbConnectionPromise = null;
function getIDB() {
  if (!idbConnectionPromise) {
    idbConnectionPromise = new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error('IndexedDB unavailable')); return; }
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  return idbConnectionPromise;
}
function idbGet(db, key) {
  return new Promise((resolve, reject) => {
    const req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbSet(db, key, value) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function idbClearAll(db) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
// Loads every persisted key from IndexedDB; any key not yet present there but found under the
// old localStorage keys is migrated over once, so upgrading doesn't lose existing data.
async function loadAllPersisted() {
  const db = await getIDB();
  const result = {};
  for (const key of PERSISTED_KEYS) {
    let val;
    try { val = await idbGet(db, key); } catch (e) { val = undefined; }
    if (val === undefined) {
      try {
        const raw = localStorage.getItem(STORAGE_PREFIX + key);
        if (raw) { val = JSON.parse(raw); await idbSet(db, key, val); }
      } catch (e) { /* nothing to migrate for this key */ }
    }
    result[key] = val;
  }
  return result;
}
async function clearAllPersisted() {
  const db = await getIDB();
  await idbClearAll(db);
  try {
    [...PERSISTED_KEYS, 'utilityGasAlloc', 'utilityElecAlloc'].forEach(k => localStorage.removeItem(STORAGE_PREFIX + k));
  } catch (e) {}
}

      allocMeterColCount: monthElecAlloc?.meterCols?.length || 0,
      allocRowsWithLoad: monthElecAlloc ? monthElecAlloc.rows.filter(r => Object.keys(r.loads).length > 0).length : 0,
      // The real question: does the Gas/Water file's own Cost Center list actually intersect

      // Cost Center values aren't matching as text even though each file looks fine on its own.
      gasWaterCCSample: monthAlloc.rows.slice(0, 5).map(r => r.costCenter),
      elecAllocCCSample: (monthElecAlloc?.rows || []).slice(0, 5).map(r => r.costCenter),
      overlapCount: monthElecAlloc ? monthAlloc.rows.filter(a => monthElecAlloc.rows.some(r => r.costCenter === a.costCenter)).length : 0,
      // Direct id comparison: does a real SADDAD number from the allocation file's own header

    // Legacy period (before the dedicated Electricity Allocation file existed): each Cost
    // Center's electricity % is its share of its OWN plant's electricity bill — confirmed by
    // Jijo — not the whole company's. The Electricity section's meters are labeled per-plant
    // ("TP01 (14K)", "TP-02 D (36K)", "TL06 FEEDER 1"...), so group those by plant first and
    // apply each Cost Center's % only against its own plant's sub-total.
    const LEGACY_ELEC_PLANT_PREFIX = { 1: '211', 2: '212', 3: '213', 4: '214', 6: '216' };
    const legacyElecPlantPrefix = (plantLabel) => {
      const m = String(plantLabel).match(/T[PL]-?0?(\d)/i);
      return m ? LEGACY_ELEC_PLANT_PREFIX[Number(m[1])] : null;
    };
    const legacyElecBillByPlantPrefix = {};
    if (usingLegacyElecPct) {
      (elecSection?.meters || []).forEach(m => {
        const prefix = legacyElecPlantPrefix(m.plantLabel);
        if (!prefix) return;
        legacyElecBillByPlantPrefix[prefix] = (legacyElecBillByPlantPrefix[prefix] || 0) + (m.monthly[utilityMonth]?.price || 0);
      });
    }

    const rows = monthAlloc.rows.map(a => {
      const cc = a.costCenter;
      const gasSkid = gasSkids.find(g => g.prefixes.some(p => cc.startsWith(p)));
      const gasBill = gasSkid ? (gasSkid.meter.monthly[utilityMonth]?.price || 0) : null;
      const gasCost = gasSkid ? gasBill * a.gasPct : null;
      // Only a real problem if there's an actual percentage with nowhere to apply it — a Cost
      // Center that simply doesn't use gas (0%/blank) isn't a data gap, so it shouldn't be flagged.
      const gasMatched = !!gasSkid || !a.gasPct;

      const waterHasSource = cc.startsWith('214') || cc.startsWith('216') || WATER_SHARED_PREFIXES.some(p => cc.startsWith(p));
      let waterCost = null;
      if (cc.startsWith('214')) waterCost = potableBill * a.waterPct; // TL04 -> Potable Tanker
      else if (cc.startsWith('216')) waterCost = roBill * a.waterPct; // TL06 -> RO Water
      else if (waterHasSource) waterCost = tawzeaBill * a.waterPct; // TL02/TL03/TL05/FP02 -> Tawzea
      const waterMatched = waterHasSource || !a.waterPct;

      let wasteWaterCost = null;
      if (WATER_SHARED_PREFIXES.some(p => cc.startsWith(p))) wasteWaterCost = wasteWaterBill * a.wasteWaterPct; // TL06 deliberately excluded for now

      let elecCost = 0, elecMatched = false;
      if (monthElecAlloc) {
        const elecRow = monthElecAlloc.rows.find(r => r.costCenter === cc);
        if (elecRow) {
          Object.entries(elecRow.loads).forEach(([saddadKey, pct]) => {
            const total = saddadKey.split('+').reduce((s, id) => {
              const m = (elecSection?.meters || []).find(mm => mm.id === id);
              return s + (m ? (m.monthly[utilityMonth]?.price || 0) : 0);
            }, 0);
            elecCost += total * pct;
            elecMatched = true;
          });
        }
      } else if (usingLegacyElecPct && a.elecPct) {
        const plantPrefix = Object.keys(legacyElecBillByPlantPrefix).find(p => cc.startsWith(p));
        const plantBill = plantPrefix ? legacyElecBillByPlantPrefix[plantPrefix] : 0;
        elecCost = plantBill * a.elecPct;
        elecMatched = !!plantPrefix;
      }
      const plantGroup = plantGroupFor(cc);
      const total = (gasCost || 0) + (waterCost || 0) + (wasteWaterCost || 0) + elecCost;
      return { costCenter: cc, generalName: a.generalName, plantGroup, gasCost, waterCost, wasteWaterCost, elecCost, total, gasMatched, waterMatched, elecMatched };
    });

    // Universal Plant filter (from the header bar) narrows everything below it — both the
    // plant-by-plant table and the top-line totals — to just the selected plant, per Jijo.
    const rowsInScope = filterPlant === 'All' ? rows : rows.filter(r => plantCodeForCC(r.costCenter) === filterPlant);
    const dieselByPlantInScope = filterPlant === 'All'
      ? dieselByPlant
      : Object.fromEntries(Object.entries(dieselByPlant).filter(([plantGroup]) => plantGroup.includes(`(${filterPlant})`)));
    const dieselMiscInScope = filterPlant === 'All' ? dieselMisc : 0; // MISC isn't attributable to one plant

    const byPlant = {};
    rowsInScope.forEach(r => {
      if (!byPlant[r.plantGroup]) byPlant[r.plantGroup] = { plantGroup: r.plantGroup, gas: 0, water: 0, wasteWater: 0, elec: 0, diesel: 0, total: 0 };
      byPlant[r.plantGroup].gas += r.gasCost || 0;
      byPlant[r.plantGroup].water += r.waterCost || 0;
      byPlant[r.plantGroup].wasteWater += r.wasteWaterCost || 0;
      byPlant[r.plantGroup].elec += r.elecCost;
      byPlant[r.plantGroup].total += r.total;
    });
    // Diesel folds in after the Cost-Center rows are aggregated, since it's plant-level, not CC-level.
    Object.entries(dieselByPlantInScope).forEach(([plantGroup, cost]) => {
      if (!byPlant[plantGroup]) byPlant[plantGroup] = { plantGroup, gas: 0, water: 0, wasteWater: 0, elec: 0, diesel: 0, total: 0 };
      byPlant[plantGroup].diesel += cost;
      byPlant[plantGroup].total += cost;
    });
    const totalDiesel = Object.values(dieselByPlantInScope).reduce((s, v) => s + v, 0) + dieselMiscInScope;

    return {
      rows: rowsInScope,
      byPlant: Object.values(byPlant).sort((x, y) => y.total - x.total),
      totalGas: rowsInScope.reduce((s, r) => s + (r.gasCost || 0), 0),
      totalWater: rowsInScope.reduce((s, r) => s + (r.waterCost || 0), 0),
      totalWasteWater: rowsInScope.reduce((s, r) => s + (r.wasteWaterCost || 0), 0),
      totalElec: rowsInScope.reduce((s, r) => s + r.elecCost, 0),
      totalDiesel,
      dieselMisc: dieselMiscInScope,
      grandTotal: rowsInScope.reduce((s, r) => s + r.total, 0) + totalDiesel,
      unmatchedGasCount: rowsInScope.filter(r => !r.gasMatched).length,
      unmatchedWaterCount: rowsInScope.filter(r => !r.waterMatched).length,
      unmatchedElecCount: rowsInScope.filter(r => !r.elecMatched).length,
      unmatchedGasTokens: [...unmatchedGasTokens],
      hasWaterBill: tawzeaMeters.length > 0 || roMeters.length > 0,
      hasWasteWaterBill: wasteWaterMeters.length > 0,
      usingLegacyElecPct,
      elecDebug,
    };
  }, [utilityBillSummary, utilityGasAlloc, utilityElecAlloc, utilityMonth, filterPlant]);
  const totalNetBookValue = filteredEquipment.reduce((s, e) => s + (e.netBookValue || 0), 0);
  const filteredPmScheduleTop = useMemo(() => pmSchedule.filter(s =>
    (filterPlant === 'All' || s.plant === filterPlant) &&
    (filterLocation === 'All' || s.location === filterLocation) &&
    (filterSection === 'All' || s.section === filterSection) &&
    (filterCategory === 'All' || equipment.find(e => e.id === s.equipmentId)?.category === filterCategory)
  ), [pmSchedule, filterPlant, filterLocation, filterSection, filterCategory, equipment]);
  const todayISO = new Date().toISOString().slice(0, 10);
  const scheduleCompletedCount = filteredPmScheduleTop.filter(s => scheduleMeta[`${s.slNo}_${s.equipmentId}_${s.startDate}`]?.completed).length;
  const scheduleDueCount = filteredPmScheduleTop.filter(s => s.startDate <= todayISO).length;
  const scheduleCriticalCount = useMemo(() => {
    if (filteredPmScheduleTop.length === 0) return 0;
    let count = 0;
    for (const s of filteredPmScheduleTop) {
      const conflicts = filteredPmScheduleTop.filter(o => o !== s && o.equipmentId === s.equipmentId && rangesOverlap(s.startDate, s.endDate, o.startDate, o.endDate));
      if (conflicts.length > 0) count++;
    }
    return count;
  }, [filteredPmScheduleTop]);
  const categoryBreakdown = useMemo(() => {
    const counts = filteredEquipment.reduce((acc, e) => {
      const key = e.category || '-';
      acc[key] = (acc[key] || 0) + 1;
      return acc;
    }, {});
    const priority = { J: 0, M: 1 };
    return Object.entries(counts).sort((a, b) => {
      const pa = priority[a[0]] ?? 99, pb = priority[b[0]] ?? 99;
      if (pa !== pb) return pa - pb;
      return b[1] - a[1];
    });
  }, [filteredEquipment]);

  // Equipment Master's "Equipment Status by Section" panel was re-searching the entire PM
  // Reports list for every one of 946 equipment items on every render, even while collapsed.
  // Build a single lookup once, and memoize the section grouping itself.
  const latestPMByEquipment = useMemo(() => {
    const map = new Map();
    for (const p of pm) {
      const existing = map.get(p.equipmentId);
      if (!existing || p.date > existing.date) map.set(p.equipmentId, p);
    }
    return map;
  }, [pm]);
  const equipmentBySection = useMemo(() => {
    const groups = filteredEquipment.reduce((acc, e) => {
      (acc[e.section] = acc[e.section] || []).push(e);
      return acc;
    }, {});
    return Object.entries(groups).sort((a, b) => a[0].localeCompare(b[0]));
  }, [filteredEquipment]);

  // Asset Master: memoized so this heavy filter/sort/match work only reruns when the
  // underlying data or filters actually change — not on every render (e.g. every
  // scroll-position update), which was causing extra lag on top of the raw row count.
  const ASSET_MATCHABLE = ['4. Equipments', '5. Tools'];
  const assetEquipmentByKey = useMemo(
    () => new Map(equipment.map(e => [`${e.assetNumber}_${e.subNumber}`, e])),
    [equipment]
  );
  const assetCategories = useMemo(
    () => ['All', ...[...new Set(assetMaster.map(a => a.category))].sort()],
    [assetMaster]
  );
  const assetData = useMemo(() => {
    const q = assetSearch.trim().toLowerCase();
    const todayISO = new Date().toISOString().slice(0, 10);
    const monthsElapsed = monthsBetween(depreciationAsOf, todayISO);
    const filtered = assetMaster
      .filter(a =>
        (filterPlant === 'All' || plantCodeForCC(a.costCenter) === filterPlant) &&
        (assetCategory === 'All' || a.category === assetCategory) &&
        (!q || [a.description, a.assetCode, a.ccName, a.serialNumber, a.costCenter].some(f => String(f).toLowerCase().includes(q)))
      )
      .sort((a, b) => a.costCenter.localeCompare(b.costCenter, undefined, { numeric: true }))
      .map(a => {
        const projectedAccumDep = Math.min(a.apc, a.accumDep + monthsElapsed * a.depByMonth);
        const projectedNBV = Math.max(0, a.apc - projectedAccumDep);
        return { ...a, projectedAccumDep, projectedNBV };
      });
    const withLink = filtered.map(a => {
      let link;
      if (!ASSET_MATCHABLE.includes(a.category)) link = { status: 'na' };
      else {
        const eq = assetEquipmentByKey.get(`${a.assetNum}_${a.subNum}`);
        link = eq ? { status: 'matched', eq } : { status: 'pending' };
      }
      return { ...a, link };
    });
    const matchedCount = withLink.filter(a => a.link.status === 'matched').length;
    const pendingCount = withLink.filter(a => a.link.status === 'pending').length;
    const totalAPC = filtered.reduce((s, a) => s + a.apc, 0);
    const totalAccumDep = filtered.reduce((s, a) => s + a.accumDep, 0);
    const totalNBV = filtered.reduce((s, a) => s + a.nbv, 0);
    const totalProjectedNBV = filtered.reduce((s, a) => s + a.projectedNBV, 0);
    const totalProjectedAccumDep = filtered.reduce((s, a) => s + a.projectedAccumDep, 0);
    const totalMonthlyDep = filtered.reduce((s, a) => s + a.depByMonth, 0);

    // Chart 1: value by asset category
    const byCategory = {};
    filtered.forEach(a => { byCategory[a.category] = (byCategory[a.category] || 0) + a.apc; });
    const categoryChartData = Object.entries(byCategory)
      .sort((a, b) => b[1] - a[1])
      .map(([label, value], i) => ({ label, value, color: PIE_COLORS[i % PIE_COLORS.length] }));

    // Chart 2: acquisition value by plant group (confirmed grouping) — renamed from "Asset
    // Value by Plant" since it's APC (original cost), not current worth.
    const byPlant = {};
    filtered.forEach(a => { const g = assetPlantGroupFor(a.costCenter); byPlant[g] = (byPlant[g] || 0) + a.apc; });
    const acquisitionByPlantData = Object.entries(byPlant)
      .sort((a, b) => b[1] - a[1])
      .map(([label, value], i) => ({ label, value, color: PIE_COLORS[i % PIE_COLORS.length] }));

    // Chart 4: projected NBV by plant — what each plant's assets are actually worth today.
    const byPlantNBV = {};
    filtered.forEach(a => { const g = assetPlantGroupFor(a.costCenter); byPlantNBV[g] = (byPlantNBV[g] || 0) + a.projectedNBV; });
    const nbvByPlantData = Object.entries(byPlantNBV)
      .sort((a, b) => b[1] - a[1])
      .map(([label, value], i) => ({ label, value, color: PIE_COLORS[i % PIE_COLORS.length] }));

    // Chart 5: projected accumulated depreciation by plant — value "used up" per plant.
    const byPlantAccumDep = {};
    filtered.forEach(a => { const g = assetPlantGroupFor(a.costCenter); byPlantAccumDep[g] = (byPlantAccumDep[g] || 0) + a.projectedAccumDep; });
    const accumDepByPlantData = Object.entries(byPlantAccumDep)
      .sort((a, b) => b[1] - a[1])
      .map(([label, value], i) => ({ label, value, color: PIE_COLORS[i % PIE_COLORS.length] }));

    // Chart 3: remaining vs used-up value, using today's projected figures
    const remainingVsUsedData = [
      { label: 'Remaining (Projected NBV)', value: totalProjectedNBV, color: PIE_COLORS[0] },
      { label: 'Used Up (Projected Depreciation)', value: totalProjectedAccumDep, color: PIE_COLORS[2] },
    ];

    return {
      filtered, withLink, matchedCount, pendingCount, totalAPC, totalAccumDep, totalNBV,
      totalProjectedNBV, totalProjectedAccumDep, totalMonthlyDep,
      categoryChartData, acquisitionByPlantData, nbvByPlantData, accumDepByPlantData, remainingVsUsedData, monthsElapsed,
    };
  }, [assetMaster, assetEquipmentByKey, filterPlant, assetCategory, assetSearch, depreciationAsOf]);

  // Catalog: match each document to Equipment Master. Exact Serial Number match is precise
  // (this document belongs to this one physical machine). No serial (common for generic
  // manuals) falls back to Model match, which naturally covers "one document, many machines"
  // since several Equipment IDs can share a model. A manual override in catalogMeta always
  // wins over either auto-match, so a wrong match or a missing one can always be corrected.
  const equipmentBySerial = useMemo(() => {
    const map = new Map();
    equipment.forEach(e => { if (e.serialNumber && e.serialNumber !== '-') map.set(e.serialNumber, e); });
    return map;
  }, [equipment]);
  const equipmentByModel = useMemo(() => {
    const map = new Map();
    equipment.forEach(e => {
      if (!e.model || e.model === '-') return;
      const key = String(e.model).toLowerCase();
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(e);
    });
    return map;
  }, [equipment]);
  const matchCatalogDoc = useCallback((doc) => {
    const key = doc.manualCode || `${doc.sheet}_${doc.description}`;
    const override = catalogMeta[key]?.equipmentId;
    if (override) return { status: 'manual', ids: [override] };
    if (doc.serialNumber && doc.serialNumber !== '-') {
      const eq = equipmentBySerial.get(doc.serialNumber);
      if (eq) return { status: 'matched-serial', ids: [eq.id] };
    }
    if (doc.equipmentModel && doc.equipmentModel !== '-') {
      const eqs = equipmentByModel.get(String(doc.equipmentModel).toLowerCase());
      if (eqs && eqs.length) return { status: 'matched-model', ids: eqs.map(e => e.id) };
    }
    return { status: 'pending', ids: [] };
  }, [catalogMeta, equipmentBySerial, equipmentByModel]);

  // Overview's Catalog card needs a true company-wide count, independent of whatever
  // search/filter is currently active on the Catalog tab itself.
  const catalogOverviewTotals = useMemo(() => {
    let matched = 0;
    catalogDocs.forEach(d => { if (matchCatalogDoc(d).status !== 'pending') matched++; });
    return { total: catalogDocs.length, matched, pending: catalogDocs.length - matched };
  }, [catalogDocs, matchCatalogDoc]);

  const catalogData = useMemo(() => {
    const q = catalogSearch.trim().toLowerCase();
    const manualTypes = ['All', ...[...new Set(catalogDocs.map(d => d.manualType).filter(Boolean))].sort()];
    const manufacturers = ['All', ...[...new Set(catalogDocs.map(d => d.manufacturer).filter(Boolean))].sort()];
    const sources = ['All', ...new Set(catalogDocs.map(d => d.sheet).filter(Boolean))];
    const filtered = catalogDocs.filter(d => {
      const match = matchCatalogDoc(d);
      const matchesQuery = !q || [d.manualCode, d.description, d.equipmentModel, d.serialNumber, d.manufacturer, ...match.ids]
        .some(f => String(f ?? '').toLowerCase().includes(q));
      // Plant/Section come from the universal filter, matched via whichever Equipment IDs
      // this document is linked to (e.g. "TL06-BPS-CDM01" -> plant TL06, section BPS) — a
      // document with no confirmed link yet simply won't match a specific plant/section.
      const matchesPlant = filterPlant === 'All' || match.ids.some(id => plantCodeFromEquipmentId(id) === filterPlant);
      const matchesSection = filterSection === 'All' || match.ids.some(id => sectionCodeFromEquipmentId(id) === filterSection);
      return (catalogManualType === 'All' || d.manualType === catalogManualType) &&
        (catalogManufacturer === 'All' || d.manufacturer === catalogManufacturer) &&
        (catalogSourceFilter === 'All' || d.sheet === catalogSourceFilter) &&
        matchesPlant && matchesSection && matchesQuery;
    })
      .sort((a, b) => String(a.description).localeCompare(String(b.description), undefined, { numeric: true }))
      .map(d => ({ ...d, match: matchCatalogDoc(d) }));
    const matchedCount = filtered.filter(d => d.match.status !== 'pending').length;
    const pendingCount = filtered.length - matchedCount;
    return { filtered, manualTypes, manufacturers, sources, matchedCount, pendingCount };
  }, [catalogDocs, catalogSearch, catalogManualType, catalogManufacturer, catalogSourceFilter, matchCatalogDoc, filterPlant, filterSection]);

  const hardCopyData = useMemo(() => {
    const q = hardCopySearch.trim().toLowerCase();
    const manualTypes = ['All', ...[...new Set(hardCopyDocs.map(d => d.manualType).filter(Boolean))].sort()];
    const filtered = hardCopyDocs.filter(d =>
      (hardCopyManualType === 'All' || d.manualType === hardCopyManualType) &&
      (!q || [d.boxNo, d.description, d.supplier, d.manualType].some(f => String(f ?? '').toLowerCase().includes(q)))
    ).sort((a, b) => String(b.boxNo).localeCompare(String(a.boxNo), undefined, { numeric: true }));
    return { filtered, manualTypes };
  }, [hardCopyDocs, hardCopySearch, hardCopyManualType]);


  // PM Schedule: same fix as Asset Master above — this was recalculating the full filter/join
  // against Equipment Master every time you switched into this tab, which is what caused the
  // multi-second delay. Now it only reruns when the schedule data, equipment data, or the
  // schedule tab's own filters actually change.
  const equipmentById = useMemo(() => new Map(equipment.map(e => [e.id, e])), [equipment]);
  const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  // Plant/Section/Category filtering here now comes from the universal header filter bar
  // (filterPlant/filterSection/filterCategory) instead of a separate local set — same
  // underlying vocabulary as Equipment Master, so one filter genuinely works across both tabs.
  const scheduleFilterOptions = useMemo(() => ({
    scheduleYears: ['All', ...[...new Set(pmSchedule.map(s => String(s.startDate).slice(0, 4)).filter(Boolean))].sort()],
  }), [pmSchedule]);
  // Combines real/confirmed data with freshly-calculated future occurrences (through 2030) —
  // recomputed on every pmSchedule change, so confirming or editing an earlier date always
  // cascades correctly through everything still projected after it (see generateProjectedRows).
  const pmScheduleWithProjections = useMemo(() => {
    return [...pmSchedule, ...generateProjectedRows(pmSchedule)];
  }, [pmSchedule]);
  // Confirms a projected row into permanent data — optionally with an edited date, which
  // becomes the new anchor for that machine+task's future projections. Confirming as-is just
  // removes the "Projected" tag; nothing else changes since the chain was already correct.
  const confirmProjectedRows = useCallback((rows, edits) => {
    setPmSchedule(prev => {
      const additions = rows.map(r => {
        const edit = edits?.[`${r.equipmentId}::${r.natureOfWork}::${r.startDate}`];
        if (!edit) return { ...r, confirmed: true };
        const spanDays = daysBetweenISO(r.startDate, r.endDate || r.startDate);
        return { ...r, startDate: edit, endDate: addDaysISO(edit, spanDays), confirmed: true };
      });
      return [...prev, ...additions];
    });
  }, []);
  // Edit/delete for real (actual or already-confirmed) rows — the manual cleanup tool for
  // when a later real upload doesn't line up with an earlier confirmed date (e.g. an execution
  // genuinely moved), so the stale row can be corrected or removed by hand rather than left
  // sitting alongside the correct one.
  const rowIdentity = (s) => `${s.slNo}_${s.equipmentId}_${s.startDate}`;
  const updatePmScheduleRow = useCallback((row, newStartDate) => {
    setPmSchedule(prev => prev.map(s => {
      if (rowIdentity(s) !== rowIdentity(row)) return s;
      const spanDays = daysBetweenISO(s.startDate, s.endDate || s.startDate);
      return { ...s, startDate: newStartDate, endDate: addDaysISO(newStartDate, spanDays) };
    }));
  }, []);
  const deletePmScheduleRow = useCallback((row) => {
    setPmSchedule(prev => prev.filter(s => rowIdentity(s) !== rowIdentity(row)));
  }, []);
  const scheduleData = useMemo(() => {
    const categoryFor = (equipmentId) => equipmentById.get(equipmentId)?.category || null;
    const q = scheduleSearch.trim().toLowerCase();
    const filtered = pmScheduleWithProjections
      .filter(s =>
        (filterPlant === 'All' || s.plant === filterPlant) &&
        (filterSection === 'All' || s.section === filterSection) &&
        (filterCategory === 'All' || categoryFor(s.equipmentId) === filterCategory) &&
        (scheduleYear === 'All' || String(s.startDate).slice(0, 4) === scheduleYear) &&
        (scheduleMonth === 'All' || String(s.startDate).slice(5, 7) === scheduleMonth) &&
        (!scheduleDateFrom || !scheduleDateTo || rangesOverlap(s.startDate, s.endDate, scheduleDateFrom, scheduleDateTo)) &&
        (!q || [s.equipmentId, s.description, s.natureOfWork].some(f => String(f).toLowerCase().includes(q)))
      )
      .sort((a, b) => {
        if (a.startDate !== b.startDate) return a.startDate.localeCompare(b.startDate);
        return a.equipmentId.localeCompare(b.equipmentId);
      });
    const completedCount = filtered.filter(s => scheduleMeta[`${s.slNo}_${s.equipmentId}_${s.startDate}`]?.completed).length;
    const projectedCount = filtered.filter(s => s.origin === 'projected' && !s.confirmed).length;
    return { filtered, completedCount, projectedCount, categoryFor };
  }, [pmScheduleWithProjections, equipmentById, filterPlant, filterSection, filterCategory, scheduleYear, scheduleMonth, scheduleDateFrom, scheduleDateTo, scheduleSearch, scheduleMeta]);

  // Gantt view's overlap detection was recalculating from scratch every time this tab became
  // visible, even if you'd just switched away and back with nothing changed. Memoized now.
  const scheduleGanttData = useMemo(() => {
    const { filtered, categoryFor } = scheduleData;
    if (filtered.length === 0) return null;
    const years = filtered.map(s => parseInt(String(s.startDate).slice(0, 4), 10)).filter(Boolean);
    const year = years.length ? years[0] : new Date().getFullYear();
    const leap = isLeapYear(year);
    const totalDays = leap ? 366 : 365;
    const monthWidths = MONTH_DAYS.map((d, i) => (d + (i === 1 && leap ? 1 : 0)) / totalDays * 100);
    const bySection = filtered.reduce((acc, s) => {
      (acc[s.section] = acc[s.section] || []).push(s);
      return acc;
    }, {});
    const withMeta = filtered.map(s => {
      const key = `${s.slNo}_${s.equipmentId}_${s.startDate}`;
      const sectionPeers = bySection[s.section] || [];
      const conflicts = sectionPeers.filter(o => o !== s && rangesOverlap(s.startDate, s.endDate, o.startDate, o.endDate));
      const sameEquipConflict = conflicts.some(o => o.equipmentId === s.equipmentId);
      const category = categoryFor(s.equipmentId);
      let severity = 'none';
      if (sameEquipConflict) severity = 'critical';
      else if (conflicts.length > 0 && category === 'J') severity = 'critical';
      else if (conflicts.length > 0) severity = 'warning';
      return { ...s, key, conflicts: conflicts.length, sameEquipConflict, category, severity,
        meta: scheduleMeta[key] || { completed: false, remarks: '' } };
    });
    const criticalCount = withMeta.filter(s => s.severity === 'critical').length;
    const warningCount = withMeta.filter(s => s.severity === 'warning').length;
    return { year, leap, totalDays, monthWidths, withMeta, criticalCount, warningCount };
  }, [scheduleData, scheduleMeta]);

  const toggleSort = (col) => {
    if (sortCol === col) { setSortDir(sortDir === 'asc' ? 'desc' : 'asc'); }
    else { setSortCol(col); setSortDir('asc'); }
  };
  const sortedMasterEquipment = useMemo(() => {
    const q = masterSearch.trim().toLowerCase();
    let arr = q
      ? filteredEquipment.filter(e =>
          [e.name, e.id, e.manufacturer, e.model, e.assetNumber, e.serialNumber, e.poNumber]
            .some(f => String(f ?? '').toLowerCase().includes(q))
        )
      : filteredEquipment;
    if (!sortCol) return arr;
    arr = [...arr];
    arr.sort((a, b) => {
      let av = a[sortCol], bv = b[sortCol];
      if (sortCol === 'value') { av = a.value; bv = b.value; }
      if (typeof av === 'number' && typeof bv === 'number') return sortDir === 'asc' ? av - bv : bv - av;
      av = String(av ?? '').toLowerCase(); bv = String(bv ?? '').toLowerCase();
      return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    });
    return arr;
  }, [filteredEquipment, sortCol, sortDir, masterSearch]);
  const alertCount = filteredPM.filter(p => p.result !== 'Normal').length;
  const downCount = filteredEquipment.filter(e => e.status === 'Down').length;
  const utilCost = utilityCalc?.grandTotal || 0;

  const nameFor = (id) => equipment.find(e => e.id === id)?.name || id;
  const metaFor = (id) => equipment.find(e => e.id === id);

    { id: 'assetMaster', label: 'Asset Master', icon: Activity },
    { id: 'pm', label: 'PM Reports', icon: Wrench },
    { id: 'catalog', label: 'Catalog', icon: FileSpreadsheet },
    { id: 'utility', label: 'Utility Bills', icon: DollarSign },
    { id: 'ganttPreview', label: 'Preventative Maintenance Schedule', icon: Calendar },
    { id: 'jobRequestPreview', label: 'Job Requests (Preview)', icon: BarChart2 },
  // Technicians don't need financial data (Asset values, Utility costs) — hidden from
  // their nav entirely rather than just visually disabled, since it's not relevant to
  // their role and the underlying figures are sensitive.
  ].filter(t => role !== 'Technician' || !['assetMaster', 'utility'].includes(t.id));
